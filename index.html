<style>
/* ============ Tokens ============ */
:root{
--font:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
--display:var(--font);
--track:-.02em;
--bg:#F2F3EE;--ink:#151A1F;--mute:#6A757D;--line:#E0E3DC;--soft:#EAEDE6;--card:#FFFFFF;
--glass:rgba(242,243,238,.82);
--quad:#12694A;--quadsoft:#DCEFE4;--acc:#AC5E16;--accsoft:#F8E6CE;--danger:#A63527;
--pr:#8F6508;--prsoft:#F7EBCD;
--gym:#151A1F;--act:#AC5E16;
--m-quad:#12694A;--m-ham:#0E6C85;--m-add:#5E7A24;--m-glute:#8B3FA3;--m-back:#2B5BA8;--m-chest:#B23A2E;
--m-sh:#9C6712;--m-tri:#6B54A3;--m-bi:#9C3A6B;--m-calf:#7A5636;--m-abs:#1C7A6C;--m-misc:#6A757D;
--mc:var(--m-misc);
--sh:0 1px 2px rgba(20,26,31,.05),0 6px 16px -12px rgba(20,26,31,.45);
--sh-lift:0 2px 6px rgba(20,26,31,.07),0 16px 30px -18px rgba(20,26,31,.55);
--rs:.6rem;--rm:1rem;--rl:1.4rem;
/* Motion */
--ease-out:cubic-bezier(.23,1,.32,1);
--ease-in-out:cubic-bezier(.77,0,.175,1);
--ease-drawer:cubic-bezier(.32,.72,0,1);
--d-press:120ms;--d-fast:180ms;--d-ui:240ms;--d-sheet:320ms;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#101418;--ink:#E7ECEA;--mute:#8F9AA2;--line:#282F35;--soft:#1B2126;--card:#181D22;
--glass:rgba(16,20,24,.82);
--quad:#4FC094;--quadsoft:#16332B;--acc:#E4A251;--accsoft:#3A2A16;--danger:#E07A6E;
--pr:#E3B547;--prsoft:#3D330F;
--gym:#E7ECEA;--act:#E4A251;
--m-quad:#4FC094;--m-ham:#4FBBD6;--m-add:#A3C55C;--m-glute:#CC8BE0;--m-back:#7FA9EE;--m-chest:#EE8A7B;
--m-sh:#E3B052;--m-tri:#A793EA;--m-bi:#E58AB6;--m-calf:#C9A075;--m-abs:#4FC3B0;--m-misc:#8F9AA2;
--sh:0 1px 2px rgba(0,0,0,.35);--sh-lift:0 10px 30px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
--bg:#101418;--ink:#E7ECEA;--mute:#8F9AA2;--line:#282F35;--soft:#1B2126;--card:#181D22;
--glass:rgba(16,20,24,.82);
--quad:#4FC094;--quadsoft:#16332B;--acc:#E4A251;--accsoft:#3A2A16;--danger:#E07A6E;
--pr:#E3B547;--prsoft:#3D330F;
--gym:#E7ECEA;--act:#E4A251;
--m-quad:#4FC094;--m-ham:#4FBBD6;--m-add:#A3C55C;--m-glute:#CC8BE0;--m-back:#7FA9EE;--m-chest:#EE8A7B;
--m-sh:#E3B052;--m-tri:#A793EA;--m-bi:#E58AB6;--m-calf:#C9A075;--m-abs:#4FC3B0;--m-misc:#8F9AA2;
--sh:0 1px 2px rgba(0,0,0,.35);--sh-lift:0 10px 30px -14px rgba(0,0,0,.8);
}
[data-m="Quads"]{--mc:var(--m-quad)}
[data-m="Hamstrings"]{--mc:var(--m-ham)}
[data-m="Adduktoren"]{--mc:var(--m-add)}
[data-m="Gesäß"]{--mc:var(--m-glute)}
[data-m="Rücken"]{--mc:var(--m-back)}
[data-m="Brust"]{--mc:var(--m-chest)}
[data-m="Schulter"]{--mc:var(--m-sh)}
[data-m="Trizeps"]{--mc:var(--m-tri)}
[data-m="Bizeps"]{--mc:var(--m-bi)}
[data-m="Waden"]{--mc:var(--m-calf)}
[data-m="Bauch"]{--mc:var(--m-abs)}
[data-m="Sonstiges"]{--mc:var(--m-misc)}

/* ============ Base ============ */
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;
-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
main{max-width:44rem;margin:0 auto;padding:.9rem .9rem 7rem}
h1{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1.05;letter-spacing:var(--track);margin:.5rem 0 .9rem}
h2{font-family:var(--display);font-size:1.4rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:1.5rem 0 .5rem}
h3{display:flex;align-items:center;gap:.45rem;font-size:.72rem;font-weight:700;text-transform:uppercase;
letter-spacing:.1em;color:var(--mute);margin:1.5rem 0 .45rem}
p{margin:.4rem 0}
.mute{color:var(--mute)}
.small{font-size:.86rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.click{cursor:pointer}
.click:active{opacity:.55}
.mdot{width:.5rem;height:.5rem;border-radius:50%;background:var(--mc);display:inline-block;flex:none}
summary{cursor:pointer;font-weight:600;font-size:.88rem;padding:.35rem 0;color:var(--mute)}
input[type=number],.hist-sets,.stats b,.cal-day,.sets td.n,.wknum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

/* ============ Cards ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rm);
padding:.85rem .95rem;margin:.65rem 0;box-shadow:var(--sh)}
.card>b:first-child{font-family:var(--display);font-size:1.3rem;font-weight:700;letter-spacing:.005em}
.card.entry{position:relative;overflow:hidden}

/* ============ Buttons ============ */
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);
padding:.55rem .85rem;cursor:pointer;line-height:1.2;font-weight:500;
transition:transform var(--d-fast) var(--ease-out),background .15s ease,color .15s ease,border-color .15s ease}
button:active{transform:scale(.97);transition-duration:var(--d-press)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;box-shadow:var(--sh)}
button.acc{background:transparent;color:var(--acc);border-color:var(--acc);font-weight:600}
button.acc.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:var(--danger);border-color:var(--line);background:transparent}
button.danger:active{border-color:var(--danger)}
button.tiny{padding:.3rem .6rem;font-size:.82rem;font-weight:600}
button.icon{width:2.4rem;height:2.4rem;padding:0;font-size:1.15rem;font-weight:600;
display:inline-flex;align-items:center;justify-content:center}
button.exbtn{width:100%;text-align:left;background:var(--bg);display:flex;
justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem .7rem}
button.exbtn span.n{font-family:var(--display);font-size:1.15rem;font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
outline:2px solid var(--acc);outline-offset:2px}

/* ============ Inputs ============ */
select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);
padding:.55rem .6rem;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft);outline:none}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
textarea{min-height:2.7rem;resize:vertical}
label.small:not(.row){display:block;color:var(--mute);font-size:.68rem;font-weight:700;
text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem}

/* ============ Pills ============ */
.pill{display:inline-flex;align-items:center;gap:.32rem;padding:.2rem .55rem;border-radius:2rem;
font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
background:var(--soft);color:var(--mute);border:1px solid transparent;white-space:nowrap}
.pill.m{background:transparent;color:var(--mc);border-color:var(--line)}
.pill.m::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--mc)}
.pill.q{background:var(--quadsoft);color:var(--quad)}
.pill.a{background:var(--accsoft);color:var(--acc)}

/* ============ Workout ============ */
.exname{display:block;font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.1;margin-bottom:.4rem}
.last{font-size:.85rem;color:var(--mute);margin:.5rem 0 .25rem}
.hint{font-size:.86rem;color:var(--quad);font-weight:600;background:var(--quadsoft);
padding:.45rem .6rem;border-radius:var(--rs);margin:.4rem 0}
.cue{font-size:.87rem;margin:.3rem 0;padding:.45rem .6rem;background:var(--soft);
border-radius:var(--rs);color:var(--mute)}
.cue b{color:var(--ink);font-weight:600}
.sets{width:100%;border-collapse:separate;border-spacing:0 .25rem;margin:.55rem 0 .35rem}
.sets th{font-size:.64rem;color:var(--mute);font-weight:700;text-align:center;
text-transform:uppercase;letter-spacing:.09em;padding:0 .3rem .1rem}
.sets td{padding:0 .15rem;vertical-align:middle}
.sets td.n{width:1.7rem;text-align:center;color:var(--mute);font-weight:700;font-size:.85rem}
.sets input{padding:.5rem .35rem;text-align:center;font-weight:600}
.sets .note input{text-align:left;font-weight:400;font-size:.85rem}
.sets td.w{width:5rem}.sets td.r{width:4.2rem}.sets td.rir{width:3.8rem}
.setrow.done td.n{color:var(--quad)}
.setrow.done td:not(.note) input{background:var(--quadsoft);border-color:transparent}
.notebox{font-size:.87rem;background:var(--soft);padding:.45rem .6rem;border-radius:var(--rs);
border-left:3px solid var(--line);margin:.35rem 0;white-space:pre-wrap;color:var(--mute)}

/* ============ Navigation ============ */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;
background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);
border-top:1px solid var(--line);padding:.25rem .25rem max(.3rem,env(safe-area-inset-bottom))}
nav.tabs button{flex:1;position:relative;background:none;border:none;box-shadow:none;color:var(--mute);
font-size:.66rem;font-weight:700;letter-spacing:.03em;padding:.5rem .2rem .35rem;
display:flex;flex-direction:column;align-items:center;gap:.18rem;border-radius:var(--rs)}
nav.tabs button svg{width:22px;height:22px;display:block}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
width:1.7rem;height:2px;border-radius:0 0 2px 2px;background:var(--ink)}
.sticky{position:sticky;top:0;z-index:5;margin:-.9rem -.9rem .7rem;padding:.65rem .9rem;
background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border-bottom:1px solid var(--line)}

/* ============ Home ============ */
.week{display:flex;align-items:center;gap:.85rem;background:var(--card);border:1px solid var(--line);
border-radius:var(--rm);padding:.7rem .9rem;margin:.7rem 0;box-shadow:var(--sh)}
.wknum{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:.9;letter-spacing:var(--track);color:var(--acc)}
.week b{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;
letter-spacing:.1em;color:var(--mute);margin-bottom:.1rem}
.wkrir{font-weight:600;font-size:.95rem}
.banner{display:flex;align-items:center;gap:.5rem;background:var(--quadsoft);color:var(--quad);
border:1px solid var(--quad);border-radius:var(--rm);padding:.6rem .85rem;margin:.3rem 0 .7rem;
font-weight:600;font-size:.92rem;cursor:pointer}
.banner::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--quad);
flex:none;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
.session-btn{position:relative;display:block;width:100%;text-align:left;margin:.8rem 0;
padding:.85rem 2.3rem .85rem .95rem;background:var(--card);border:1px solid var(--line);
border-radius:var(--rm);box-shadow:var(--sh)}
.session-btn b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.1}
.session-btn::after{content:"›";position:absolute;right:1rem;top:50%;transform:translateY(-50%);
font-size:1.6rem;line-height:1;color:var(--mute)}
.session-btn.next{border-color:var(--ink);box-shadow:var(--sh-lift)}
.session-btn.next::before{content:"Nächste";position:absolute;top:-.55rem;left:.9rem;
background:var(--ink);color:var(--bg);font-size:.6rem;font-weight:700;text-transform:uppercase;
letter-spacing:.09em;padding:.14rem .5rem;border-radius:2rem}

/* ============ Plan ============ */
.slot{border-bottom:1px solid var(--line);padding:.75rem 0}
.slot>.row:first-child{flex-wrap:nowrap}
.slot>.row:first-child .pill{flex:none;font-size:.62rem;padding:.18rem .45rem;letter-spacing:.03em}
.slot>.row:first-child button.icon{width:2rem;height:2rem;font-size:.95rem}
.slot:last-of-type{border-bottom:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}

/* ============ Listen & Tabellen ============ */
.list-item{padding:.7rem 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.hist-sets{font-size:.92rem;font-weight:600}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.cmp{border-collapse:collapse;width:100%;font-size:.9rem}
table.cmp td,table.cmp th{padding:.45rem .4rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{color:var(--mute);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
table.cmp tr:last-child td{border-bottom:none}

/* ============ Chips ============ */
.chips{display:flex;gap:.4rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
margin:.5rem -.9rem;padding:.1rem .9rem;-webkit-overflow-scrolling:touch;
-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none}
.card .chips,.sheet .chips{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
.chips button{padding:.35rem .75rem;font-size:.8rem;font-weight:600;border-radius:2rem;background:var(--card)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ============ Kalender ============ */
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stats.s4 b{font-size:1.5rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.7rem 0;
font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.stats span{display:flex;flex-direction:column;gap:.1rem;background:var(--card);
border:1px solid var(--line);border-radius:var(--rm);padding:.55rem .65rem;box-shadow:var(--sh)}
.stats b{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1;letter-spacing:var(--track);
color:var(--ink);text-transform:none}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:.6rem 0 .5rem}
.cal-head b{font-family:var(--display);font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem}
.cal-grid .wd{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
color:var(--mute);text-align:center;padding-bottom:.2rem}
.cal-day{aspect-ratio:1;border-radius:var(--rs);border:1.5px solid transparent;background:var(--soft);
display:flex;flex-direction:column;align-items:center;justify-content:center;
font-size:.9rem;font-weight:600;cursor:pointer;position:relative;transition:transform .12s}
.cal-day:active{transform:scale(.92)}
.cal-day.other{opacity:.3}
.cal-day.gym{background:var(--quadsoft);color:var(--quad);font-weight:700}
.cal-day.today{text-decoration:none;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.cal-day.sel{border-color:var(--ink)}
.cal-day .dots{display:flex;gap:2px;margin-top:3px;height:5px}
.cal-day .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal-day .dots i.g{background:var(--quad)}
.cal-day .dots i.a{background:var(--act)}
.cal-day .dots i.r{background:var(--mute)}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem}
.wk-day{background:var(--card);border:1px solid var(--line);border-radius:var(--rm);
padding:.45rem .35rem;min-height:5.2rem;font-size:.7rem;cursor:pointer;box-shadow:var(--sh)}
.wk-day.gym{background:var(--quadsoft);border-color:var(--quad)}
.wk-day.sel{border-color:var(--ink);border-width:1.5px}
.wk-day b{display:block;font-size:.66rem;font-weight:700;text-transform:uppercase;
letter-spacing:.01em;white-space:nowrap;color:var(--mute);margin-bottom:.25rem}
.wk-day.today b{color:var(--acc)}
.wk-day .t{color:var(--quad);font-weight:600}
.wk-day .a{color:var(--act)}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem}
.yr .mo{background:var(--card);border:1px solid var(--line);border-radius:var(--rm);padding:.55rem;box-shadow:var(--sh)}
.yr .mo b{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;
letter-spacing:.08em;color:var(--mute);margin-bottom:.35rem;cursor:pointer}
.yr .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yr .md{aspect-ratio:1;border-radius:2px;background:var(--soft);cursor:pointer}
.yr .md.gym{background:var(--quad)}
.yr .md.act{background:var(--act)}
.yr .md.today{outline:1.5px solid var(--acc);outline-offset:1px}

/* ============ Sheet / Picker ============ */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
background:rgba(10,14,18,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
animation:fade var(--d-ui) var(--ease-out);
transition:opacity var(--d-fast) var(--ease-out)}
.overlay.closing{opacity:0}
.sheet{background:var(--bg);width:100%;max-width:44rem;max-height:92vh;
border-radius:var(--rl) var(--rl) 0 0;padding:.5rem .9rem calc(.9rem + env(safe-area-inset-bottom));
display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.28);
animation:sheetin var(--d-sheet) var(--ease-drawer);
transition:transform var(--d-fast) var(--ease-out)}
@keyframes sheetin{from{transform:translateY(100%)}}
.overlay.closing .sheet{transform:translateY(100%)}
.sheet::before{content:"";width:2.5rem;height:.25rem;border-radius:2rem;background:var(--line);margin:.15rem auto .6rem}
.sheet>.row b{font-family:var(--display);font-size:1.3rem}
.sheet .pk-list{overflow-y:auto;flex:1;margin-top:.5rem;-webkit-overflow-scrolling:touch}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(14%)}}
.pk-item{padding:.6rem .3rem;border-bottom:1px solid var(--line);cursor:pointer;
display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.pk-item:active{background:var(--soft)}
.pk-item[data-pick="__new"] b{color:var(--acc)}
.pk-item b{font-weight:600}
.pk-item .m{display:flex;flex-direction:column;align-items:flex-end;gap:.1rem;
font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
color:var(--mute);white-space:nowrap;text-align:right}
.pk-item .m .mrow{display:flex;align-items:center;gap:.3rem;color:var(--mc)}

/* ============ Toast ============ */
.toast{position:fixed;left:50%;bottom:5rem;z-index:30;padding:.6rem 1rem;border-radius:2rem;white-space:nowrap;max-width:calc(100vw - 1.5rem);overflow:hidden;text-overflow:ellipsis;
background:var(--ink);color:var(--bg);font-size:.88rem;font-weight:600;box-shadow:var(--sh-lift);
opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px) scale(.96);
transition:opacity var(--d-ui) var(--ease-out),transform var(--d-ui) var(--ease-out)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

/* ============ Satzzeilen mit Haken und Steppern ============ */
.sets td.n{width:2.3rem;padding-right:.2rem}
.sets td.w{width:6.4rem}
.sets td.r{width:5.6rem}
.sets td.rir{width:2.9rem}
.sets td.nt{width:1.9rem}
.chk{width:2rem;height:2.15rem;padding:0;display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:.9rem;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:var(--rs)}
.chk{transition:background var(--d-fast) ease,border-color var(--d-fast) ease,color var(--d-fast) ease,transform var(--d-fast) var(--ease-out)}
.chk:active{transform:scale(.9);transition-duration:var(--d-press)}
.setrow.done .chk{background:var(--quad);border-color:var(--quad);color:var(--bg);font-size:1.05rem}
.setrow.done .chk.just{animation:chkpop 220ms var(--ease-out)}
@keyframes chkpop{0%{transform:scale(.88)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
.sets input{transition:background var(--d-ui) ease,border-color var(--d-ui) ease,box-shadow .15s ease}
.setrow td.n{transition:color var(--d-fast) ease}
.stp{display:flex;align-items:stretch;gap:2px}
.stp input{flex:1;min-width:0;padding:.5rem .1rem}
.sb{flex:none;width:1.5rem;padding:0;font-size:1.05rem;font-weight:600;color:var(--mute);
background:transparent;border-color:transparent;border-radius:calc(var(--rs) - .2rem);display:flex;align-items:center;justify-content:center}
.sb:active{background:var(--acc);color:#fff}
.nb{width:1.9rem;height:2.15rem;padding:0;color:var(--mute);background:transparent;border-color:transparent;
display:flex;align-items:center;justify-content:center}
.nb svg{width:15px;height:15px}
.nb.has{color:var(--acc)}
.setrow.done .stp input,.setrow.done td.rir input{background:var(--quadsoft);border-color:transparent}
.noterow{display:none}
.noterow.on{display:table-row}
.noterow input{text-align:left;font-weight:400;font-size:.85rem;padding:.4rem .5rem}
.noterow td{padding-bottom:.25rem}

/* ============ Fortschritt im Kopf ============ */
.wprog{display:flex;align-items:center;gap:.6rem;margin-top:.5rem}
.wpbar{flex:1;height:.4rem;border-radius:2rem;background:var(--soft);overflow:hidden}
.wpbar i{display:block;height:100%;width:100%;background:var(--quad);border-radius:2rem;
transform-origin:left;transform:scaleX(0);transition:transform var(--d-sheet) var(--ease-out)}
#wptext{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);white-space:nowrap}

/* ============ Erledigte Uebung eingeklappt ============ */
.entry .ebody{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--d-ui) var(--ease-out)}
.entry .ebody>div{overflow:hidden;margin:-4px -6px;padding:4px 6px;transition:opacity var(--d-fast) var(--ease-out)}
.entry.folded .ebody{grid-template-rows:0fr}
.entry.folded .ebody>div{opacity:0}
.entry.folded.just::after{animation:fade var(--d-fast) var(--ease-out) 100ms both}
.entry.folded{padding-top:.7rem;padding-bottom:.7rem;opacity:.85}
.entry.folded .exname{margin-bottom:.25rem}
.entry.folded::after{content:attr(data-sum);display:block;margin-top:.35rem;font-size:.9rem;
font-weight:600;color:var(--quad);font-variant-numeric:tabular-nums}
.entry.folded .exname::after{content:" \2713";color:var(--quad)}

/* ============ Pausentimer ============ */
.restbar{position:fixed;left:.6rem;right:.6rem;bottom:calc(3.7rem + env(safe-area-inset-bottom));
z-index:15;max-width:43rem;margin:0 auto;display:flex;align-items:center;gap:.5rem;
padding:.5rem .6rem;border-radius:var(--rm);background:var(--glass);color:var(--ink);
backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
border:1px solid var(--line);box-shadow:var(--sh-lift);animation:restin var(--d-sheet) var(--ease-drawer);
transition:transform var(--d-fast) var(--ease-out),opacity var(--d-fast) var(--ease-out)}
@keyframes restin{from{opacity:0;transform:translateY(120%)}}
.restbar.closing{transform:translateY(120%);opacity:0}
.restbar b{transition:opacity var(--d-fast) ease}
.restbar .rb-main{flex:1;min-width:0;cursor:pointer}
.restbar b{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1;
font-variant-numeric:tabular-nums;display:block}
.rb-p{height:.3rem;border-radius:2rem;background:var(--soft);margin-top:.35rem;overflow:hidden}
.rb-p i{display:block;height:100%;width:100%;background:var(--quad);border-radius:2rem;
transform-origin:left;transform:scaleX(1);transition:transform 250ms linear}
.rb-b{background:transparent;border:1px solid var(--line);color:inherit;
padding:.4rem .55rem;font-size:.8rem;font-weight:700;border-radius:var(--rs)}
.rb-b:active{background:var(--soft)}
.rb-x{padding:.4rem .6rem}
.restbar.over{background:var(--quad);color:var(--bg);border-color:transparent;cursor:pointer;
animation:fade var(--d-fast) var(--ease-out),overpulse 1.6s ease-in-out .4s 3}
@keyframes overpulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--quad) 35%,transparent)}}
.rb-hint{font-size:.78rem;font-weight:600;opacity:.8}
body.resting main{padding-bottom:11rem}
body.resting .toast{bottom:8.6rem}

/* ============ Diagramme ============ */
.chart{width:100%;height:auto;display:block;margin:.4rem 0 .2rem;overflow:visible}
.chart .ax{fill:var(--mute);font-size:9px;font-weight:600;letter-spacing:.03em}
.chart .gl{stroke:var(--line);stroke-width:1}
.ring{width:3.5rem;height:3.5rem;flex:none}
.ring .rtxt{font-family:var(--display);font-size:21px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.ring .rsub{font-size:8px;font-weight:700;fill:var(--mute);letter-spacing:.08em}

/* ============ Wochenvolumen ============ */
.vol{display:flex;align-items:center;gap:.5rem;margin:.35rem 0}
.vname{width:6.2rem;flex:none;font-size:.78rem;font-weight:600;color:var(--mc);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar{flex:1;height:.55rem;border-radius:2rem;background:var(--soft);overflow:hidden}
.vbar i{display:block;height:100%;width:100%;border-radius:2rem;background:var(--mc);transform-origin:left}
#app.entered .vbar i{animation:barfill var(--d-sheet) var(--ease-out)}
@keyframes barfill{from{transform:scaleX(0)}}
.vnum{width:3.6rem;flex:none;text-align:right;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.vnum s{text-decoration:none;font-weight:600;color:var(--mute);font-size:.72rem}

/* ============ Bestleistung ============ */
.pill.pr{background:var(--pr);color:var(--bg)}
.pill.pr.just{animation:prpop 320ms var(--ease-out)}
@keyframes prpop{0%{opacity:0;transform:scale(.7) translateY(2px)}60%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.setrow.pr .chk{background:var(--pr);border-color:var(--pr);color:var(--bg)}
.setrow.pr .chk.just{animation:prglow 900ms var(--ease-out)}
@keyframes prglow{0%{box-shadow:0 0 0 0 var(--prsoft)}40%{box-shadow:0 0 0 7px var(--prsoft)}100%{box-shadow:0 0 0 0 transparent}}
.best{margin:.3rem 0 .2rem}
.best b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;color:var(--acc)}

/* ============ Plan: Drag & Drop, Rotation, Supersatz ============ */
.drag{cursor:grab;touch-action:none;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;
width:1.7rem;height:2.1rem;flex:none;border-radius:var(--rs);-webkit-user-select:none;user-select:none}
.drag svg{width:10px;height:16px}
.drag:active{cursor:grabbing;background:var(--soft)}
.dragging{opacity:.75;box-shadow:var(--sh-lift)!important;position:relative;z-index:3}
.slot.dragging{background:var(--soft);border-radius:var(--rs);padding-left:.4rem;padding-right:.4rem}
body.dragging{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.sess .ssum{display:none;margin:.2rem 0 0 2.2rem}
.sess.closed .ssum{display:block}
.sess.closed .sbody{display:none}
.sess .chev{transition:transform var(--d-ui) var(--ease-out)}
.sess.closed .chev{transform:rotate(-90deg)}
.sess.closed{padding-bottom:.7rem}
.slot.ss{border-bottom:2px dashed var(--acc)}
.pill.ss{background:var(--ink);color:var(--bg)}
.card.entry.ssA{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none}
.card.entry.ssB{margin-top:0;border-top-left-radius:0;border-top-right-radius:0;border-top:2px dashed var(--acc)}
.rots{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin:.4rem 0}
.rots .lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.rot{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:2rem;overflow:hidden;background:var(--card)}
.rot button{border:none;border-radius:0;padding:.3rem .6rem;font-size:.8rem;font-weight:600;background:transparent;box-shadow:none}
.rot button+button{border-left:1px solid var(--line);color:var(--mute);padding:.3rem .5rem}
.rot button:active{transform:none;background:var(--soft)}
.rots button.tiny{border-radius:2rem}

/* ============ Gruppierte Liste (Einstellungen) ============ */
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--rm);box-shadow:var(--sh);margin:.65rem 0;overflow:hidden}
.group>.card{margin:0;border:none;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line)}
.group>.card:last-child{border-bottom:none}
.group>.card>b:first-child{font-size:1.05rem;letter-spacing:0}

/* ============ Backup-Hinweis, Undo ============ */
.banner.warn{background:var(--accsoft);color:var(--acc);border-color:var(--acc)}
.banner.warn::before{background:var(--acc);animation:none}
.toast.show{pointer-events:auto}
.toast button{background:transparent;border:1px solid rgba(128,128,128,.55);color:inherit;

#rest{view-transition-name:rest}
#toast{view-transition-name:toast}
::view-transition-old(root){animation:vt-out var(--d-fast) var(--ease-out)}

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function p2(n){return (n<10?'0':'')+n;}
function ds(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){return ds(new Date());}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function weekStart(s){var d=pd(s);var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return ds(d);}
function fmtDate(s){if(!s)return '';var p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0].slice(2);}

function mpill(m){return '<span class="pill m" data-m="'+esc(m)+'">'+esc(m)+'</span>';}

var TKEY='trainingsapp.theme';
function themePref(){try{return localStorage.getItem(TKEY)||'auto';}catch(e){return 'auto';}}
function applyTheme(){var p=themePref(),r=document.documentElement;
  if(p==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',p);
  var dark=p==='dark'||(p==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',dark?'#101418':'#F2F3EE');}
function setTheme(v){try{localStorage.setItem(TKEY,v);}catch(e){}applyTheme();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1800);}
function closeOverlay(cb){
  var ov=document.querySelector('.overlay');
  if(!ov){cb();return;}
  if(ov.classList.contains('closing'))return;
  ov.classList.add('closing');
  var done=false;function finish(){if(done)return;done=true;cb();}
  ov.addEventListener('transitionend',function(ev){if(ev.target===ov)finish();});
  setTimeout(finish,220);}

/* ---------- Auswertung ---------- */
function e1(st){var w=Number(st.w||0),r=Number(st.r||0);return (w>0&&r>0)?w*(1+r/30):0;}

    w.entries.forEach(function(e){if(e.exId!==exId||!!e.uni!==!!uni)return;

function streakWeeks(){
  var c=weekStart(today());
  if(!countRange(c,addDays(c,6)))c=addDays(c,-7);
  var n=0,guard=0;
  while(countRange(c,addDays(c,6))>0&&guard++<520){n++;c=addDays(c,-7);}
  return n;}
function bwAvgRange(endDate,days){
  var from=addDays(endDate,-(days-1)),v=[];
  S.bodyweight.forEach(function(b){if(b.date>=from&&b.date<=endDate)v.push(Number(b.kg));});
  return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null;}

/* ---------- Diagramm ---------- */
function chartHTML(series,o){
  o=o||{};
  var W=320,H=o.h||118,L=34,R=8,T=10,B=18;
  var all=[];series.forEach(function(se){all=all.concat(se.pts);});
  if(all.length<2)return '';
  var xs=[],ys=[];all.forEach(function(q){xs.push(q.x);ys.push(q.y);});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  var dy0=Math.min.apply(null,ys),dy1=Math.max.apply(null,ys);
  var y0=dy0,y1=dy1;
  if(y1<=y0){y1=y0+1;y0=y0-1;}
  var pad=(y1-y0)*0.12;y0-=pad;y1+=pad;
  var rnd=(dy1-dy0)>=10?0:1;
  function lbl(v){return String(rnd?Math.round(v*10)/10:Math.round(v)).replace('.',',');}
  function PX(x){return L+(x1===x0?(W-L-R)/2:(x-x0)/(x1-x0)*(W-L-R));}
  function PY(y){return T+(1-(y-y0)/(y1-y0))*(H-T-B);}
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  [dy0,(dy0+dy1)/2,dy1].forEach(function(yv){var yy=PY(yv);
    h+='<line class="gl" x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'"/>';
    h+='<text class="ax" x="'+(L-5)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+lbl(yv)+'</text>';});
  series.forEach(function(se){
    var d=se.pts.map(function(q,i){return (i?'L':'M')+PX(q.x).toFixed(1)+' '+PY(q.y).toFixed(1);}).join(' ');
    h+='<path d="'+d+'" fill="none" stroke="'+(se.color||'var(--quad)')+'" stroke-width="'+(se.w||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(se.dash?' stroke-dasharray="4 3"':'')+'/>';
    if(se.dots&&se.pts.length<=40)se.pts.forEach(function(q){
      h+='<circle cx="'+PX(q.x).toFixed(1)+'" cy="'+PY(q.y).toFixed(1)+'" r="2.6" fill="'+(se.color||'var(--quad)')+'"/>';});});
  if(o.x0)h+='<text class="ax" x="'+L+'" y="'+(H-4)+'">'+esc(o.x0)+'</text>';
  if(o.x1)h+='<text class="ax" x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">'+esc(o.x1)+'</text>';
  return h+'</svg>';}
function ringSVG(n,tot){
  var r=22,c=2*Math.PI*r,f=Math.max(0,Math.min(1,n/tot));
  var col=n>tot?'var(--danger)':(n===tot?'var(--acc)':'var(--quad)');
  return '<svg class="ring" viewBox="0 0 56 56"><circle cx="28" cy="28" r="'+r+'" fill="none" stroke="var(--soft)" stroke-width="6"/>'
    +'<circle cx="28" cy="28" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-f)).toFixed(1)+'" transform="rotate(-90 28 28)"/>'
    +'<text class="rtxt" x="28" y="31" text-anchor="middle">'+n+'</text>'
    +'<text class="rsub" x="28" y="41" text-anchor="middle">VON '+tot+'</text></svg>';}

/* ---------- Backup-Erinnerung ---------- */
function backupNote(){
  if(!S.workouts.length)return '';
  if(!S.lastExport)return S.workouts.length>=3?'Noch kein Backup gemacht':'';
  var days=Math.floor((pd(today())-pd(S.lastExport))/864e5);
  var fresh=S.workouts.some(function(w){return w.date>S.lastExport;});
  return (days>=14&&fresh)?'Letztes Backup vor '+days+' Tagen':'';}

/* ---------- Supersatz ---------- */
function ssRole(w,ei){
  var s=sessionById(w.sessionId);if(!s)return '';
  var e=w.entries[ei],idx=-1;s.slots.forEach(function(q,i){if(q.id===e.slotId)idx=i;});
  if(idx<0)return '';
  var sl=s.slots[idx],nx=w.entries[ei+1],pv=w.entries[ei-1];
  if(sl.ss&&nx&&s.slots[idx+1]&&nx.slotId===s.slots[idx+1].id)return 'a';
  if(idx>0&&s.slots[idx-1].ss&&pv&&pv.slotId===s.slots[idx-1].id)return 'b';
  return '';}

/* ---------- Drag & Drop (Pointer Events) ---------- */
var drag=null;
var GRIP='<svg viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="7.5" cy="2.5" r="1.6"/><circle cx="2.5" cy="8" r="1.6"/><circle cx="7.5" cy="8" r="1.6"/><circle cx="2.5" cy="13.5" r="1.6"/><circle cx="7.5" cy="13.5" r="1.6"/></svg>';
function dragItems(cont){return Array.prototype.slice.call(cont.children).filter(function(c){return c.hasAttribute('data-dragitem');});}
document.addEventListener('pointerdown',function(ev){
  var h=ev.target.closest('[data-drag]');if(!h)return;
  var item=h.closest('[data-dragitem]');if(!item)return;
  drag={item:item,cont:item.parentNode,kind:h.dataset.drag,pid:ev.pointerId,moved:false};
  try{h.setPointerCapture(ev.pointerId);}catch(e){}
  item.classList.add('dragging');document.body.classList.add('dragging');ev.preventDefault();});
document.addEventListener('pointermove',function(ev){
  if(!drag||ev.pointerId!==drag.pid)return;
  drag.moved=true;var y=ev.clientY,items=dragItems(drag.cont);
  if(y<90)window.scrollBy(0,-10);else if(y>window.innerHeight-130)window.scrollBy(0,10);
  for(var i=0;i<items.length;i++){var el=items[i];if(el===drag.item)continue;var r=el.getBoundingClientRect();
    if(y<r.top+r.height/2){if(el.previousElementSibling!==drag.item)drag.cont.insertBefore(drag.item,el);return;}}
  var last=items[items.length-1];if(last!==drag.item)drag.cont.insertBefore(drag.item,last.nextSibling);});
function dragEnd(cancel){
  if(!drag)return;var d=drag;drag=null;document.body.classList.remove('dragging');
  if(cancel||!d.moved){d.item.classList.remove('dragging');if(cancel&&d.moved)render();return;}
  var items=dragItems(d.cont);
  if(d.kind==='sess'){
    var curId=(S.sessions[S.nextIdx%S.sessions.length]||{}).id;
    var ns=items.map(function(c){return sessionById(c.dataset.sid);}).filter(Boolean);
    if(ns.length===S.sessions.length){S.sessions=ns;var ni=0;S.sessions.forEach(function(q,i){if(q.id===curId)ni=i;});S.nextIdx=ni;}
  }else{
    var sess=sessionById(d.kind.slice(5));
    if(sess){var nsl=items.map(function(c){return slotById(sess,c.dataset.slid);}).filter(Boolean);
      if(nsl.length===sess.slots.length)sess.slots=nsl;}
  }
  save();render();toast('Reihenfolge gespeichert');}
document.addEventListener('pointerup',function(){dragEnd(false);});
document.addEventListener('pointercancel',function(){dragEnd(true);});

function csvCell(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function doCSV(){
  var rows=[['Datum','Einheit','Übung','Muskelgruppe','Gerät','Satz','kg','Wdh','RIR','je Seite','Satz-Notiz','Übungs-Notiz','Einheits-Notiz']];
  S.workouts.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(w){
    w.entries.forEach(function(e){var x=ex(e.exId);
      e.sets.forEach(function(st,i){if(!filled(st))return;
        rows.push([w.date,w.sessionName,x.name,x.muscle,x.equip,i+1,dk(st.w),st.r,st.rir,e.uni?'ja':'',st.note,e.note,w.note]);});});});
  if(S.bodyweight.length){rows.push([]);rows.push(['Datum','Körpergewicht kg']);
    S.bodyweight.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(b){rows.push([b.date,dk(b.kg)]);});}
  var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');
  try{var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='training-'+today()+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('CSV erstellt');}
  catch(e){toast('CSV-Export nicht möglich');}}

    h+='<div class="ssum small mute">'+s.slots.length+' Übungen'+(s.tag?' · '+esc(s.tag):'')+'</div>';
    h+='<div class="sbody"><input data-stag="'+s.id+'" value="'+esc(s.tag)+'" placeholder="Kurzbeschreibung" class="small" style="margin:.4rem 0">';
    s.slots.forEach(function(sl,i){
      var x=ex(sl.exId);

/* ---------- Kalender ---------- */
function dayInfo(d){
  var ws=S.workouts.filter(function(w){return w.date===d;});var acts=S.activities.filter(function(a){return a.date===d;});
  var running=S.active&&S.active.date===d?S.active:null;
  return {ws:ws,acts:acts,running:running,gym:ws.length>0||!!running,any:ws.length>0||acts.length>0||!!running};
}
function countRange(from,to){var set={};S.workouts.forEach(function(w){if(w.date>=from&&w.date<=to)set[w.date]=1;});if(S.active&&S.active.date>=from&&S.active.date<=to)set[S.active.date]=1;return Object.keys(set).length;}
function renderCal(){
  var c=ui.cal;var t=today();
  var h='<h1>Kalender</h1>'+chips([['week','Woche'],['month','Monat'],['year','Jahr'],['list','Liste']],c.mode,'calmode');
  var ws=weekStart(t),y=t.slice(0,4),m=t.slice(0,7);
  h+='<div class="stats s4"><span>Woche <b>'+countRange(ws,addDays(ws,6))+'</b></span><span>Monat <b>'+countRange(m+'-01',m+'-31')+'</b></span><span>Jahr <b>'+countRange(y+'-01-01',y+'-12-31')+'</b></span><span>Serie <b>'+streakWeeks()+'</b></span></div>';
  if(c.mode==='month')h+=calMonth(c.anchor);else if(c.mode==='week')h+=calWeek(c.anchor);else if(c.mode==='year')h+=calYear(c.anchor);else h+=calList();
  if(c.mode!=='list')h+=dayDetail(c.sel);
  return h;
}
function dayClass(d,extra){var i=dayInfo(d);return (extra||'')+(i.gym?' gym':'')+(d===ui.cal.sel?' sel':'')+(d===today()?' today':'');}
function dots(d){var i=dayInfo(d);var s='';if(i.running)s+='<i class="r"></i>';i.ws.forEach(function(){s+='<i class="g"></i>';});i.acts.forEach(function(){s+='<i class="a"></i>';});return '<div class="dots">'+s+'</div>';}
function calMonth(anchor){
  var d=pd(anchor);var y=d.getFullYear(),mo=d.getMonth();var first=new Date(y,mo,1);var off=(first.getDay()+6)%7;var dim=new Date(y,mo+1,0).getDate();
  var h='<div class="cal-head"><button class="icon" data-calnav="-1">‹</button><b>'+MONTHS[mo]+' '+y+'</b><button class="icon" data-calnav="1">›</button></div><div class="cal-grid">'+WD.map(function(w){return '<div class="wd">'+w+'</div>';}).join('');
  var start=new Date(y,mo,1-off);
  for(var i=0;i<42;i++){var dd=new Date(start);dd.setDate(start.getDate()+i);var s=ds(dd);var other=dd.getMonth()!==mo;if(i>=35&&other)break;
    h+='<div class="cal-day'+dayClass(s,other?' other':'')+'" data-day="'+s+'">'+dd.getDate()+dots(s)+'</div>';}
  return h+'</div>';
}
function calWeek(anchor){
  var ws=weekStart(anchor);var h='<div class="cal-head"><button class="icon" data-calnav="-1">‹</button><b>Woche ab '+fmtDate(ws)+'</b><button class="icon" data-calnav="1">›</button></div><div class="wk-grid">';
  for(var i=0;i<7;i++){var s=addDays(ws,i);var inf=dayInfo(s);
    h+='<div class="wk-day'+dayClass(s)+'" data-day="'+s+'"><b>'+WD[i]+' '+s.slice(8)+'</b>'+(inf.running?'<div class="t">läuft</div>':'')+inf.ws.map(function(w){return '<div class="t">'+esc(w.sessionName||'Training')+'</div>';}).join('')+inf.acts.map(function(a){return '<div class="a">'+esc(a.text)+'</div>';}).join('')+'</div>';}
  return h+'</div>';
}
function calYear(anchor){
  var y=pd(anchor).getFullYear();var h='<div class="cal-head"><button class="icon" data-calnav="-1">‹</button><b>'+y+'</b><button class="icon" data-calnav="1">›</button></div><div class="yr">';
  for(var mo=0;mo<12;mo++){var dim=new Date(y,mo+1,0).getDate();var off=(new Date(y,mo,1).getDay()+6)%7;var mstr=y+'-'+p2(mo+1);
    h+='<div class="mo"><b data-jump="'+mstr+'-01">'+MONTHS[mo].slice(0,3)+' · '+countRange(mstr+'-01',mstr+'-31')+'</b><div class="mg">';
    for(var k=0;k<off;k++)h+='<span></span>';
    for(var d=1;d<=dim;d++){var s=mstr+'-'+p2(d);var inf=dayInfo(s);h+='<div class="md'+(inf.gym?' gym':inf.acts.length?' act':'')+(s===today()?' today':'')+'" data-day="'+s+'" data-jump="'+s+'"></div>';}
    h+='</div></div>';}
  return h+'</div>';
}
function calList(){
  var items=[];S.workouts.forEach(function(w){items.push({d:w.date,k:'w',o:w});});S.activities.forEach(function(a){items.push({d:a.date,k:'a',o:a});});
  items.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;});
  if(!items.length)return '<p class="mute">Noch nichts geloggt. Starte auf „Heute“ eine Einheit oder trag in der Monatsansicht ein Training nach.</p>';
  var h='<div class="card">';
  items.forEach(function(it){
    if(it.k==='w'){var w=it.o;h+='<div class="list-item click" data-editw="'+w.id+'"><b>'+esc(w.sessionName||'Training')+'</b>'+(w.kurz?' <span class="pill a">Kurz</span>':'')+'<div class="small mute">'+fmtDate(w.date)+' · '+w.entries.length+' Übungen · '+setCount(w)+' Sätze</div></div>';}
    else{var a=it.o;h+='<div class="list-item click" data-day="'+a.date+'" data-tomonth="1"><b style="color:var(--act)">'+esc(a.text)+'</b><div class="small mute">'+fmtDate(a.date)+(a.minutes?' · '+a.minutes+' min':'')+'</div></div>';}
  });
  return h+'</div>';
}
function setCount(w){return w.entries.reduce(function(n,e){return n+e.sets.filter(filled).length;},0);}

  var inf=dayInfo(d);var dd=pd(d);

  inf.ws.forEach(function(w){
    var open=ui.openW===w.id;
    h+='<div class="card"><div class="row click" data-openw="'+w.id+'"><div class="grow"><b>'+esc(w.sessionName||'Training')+'</b>'+(w.kurz?' <span class="pill a">Kurz</span>':'')+'<div class="small mute">'+w.entries.length+' Übungen · '+setCount(w)+' Sätze</div></div><span class="mute">'+(open?'▾':'▸')+'</span></div>';
    if(open){if(w.note)h+='<div class="notebox">'+esc(w.note)+'</div>';
      w.entries.forEach(function(e){var dn=e.sets.filter(filled);h+='<div class="list-item"><b>'+esc(ex(e.exId).name)+'</b>'+(e.uni?' <span class="small mute">je Seite</span>':'')+'<div class="hist-sets">'+(dn.length?esc(fmtSets(dn)):'<span class="mute">nichts eingetragen</span>')+'</div>'+(e.note?'<div class="small mute">'+esc(e.note)+'</div>':'')+e.sets.map(function(x,i){return x.note?'<div class="small mute">Satz '+(i+1)+': '+esc(x.note)+'</div>':'';}).join('')+'</div>';});}
    h+='<div class="row" style="margin-top:.5rem"><button class="tiny primary" data-editw="'+w.id+'">Bearbeiten</button><button class="tiny danger" data-act="wdel" data-id="'+w.id+'">Löschen</button></div></div>';
  });
  inf.acts.forEach(function(a){
    h+='<div class="card"><label class="small">Aktivität</label><div class="row"><input data-atext="'+a.id+'" value="'+esc(a.text)+'" class="grow" placeholder="z. B. Gravel-Bike"><input type="number" data-amin="'+a.id+'" value="'+esc(a.minutes||'')+'" placeholder="min" style="width:5rem"><button class="tiny danger" data-adel="'+a.id+'">✕</button></div><textarea data-anote="'+a.id+'" placeholder="Notiz" style="margin-top:.4rem">'+esc(a.note||'')+'</textarea></div>';
  });
  h+='<div class="row"><button data-act="addact" class="grow">+ Aktivität</button><div class="grow"><select id="pastsel"><option value="">+ Training nachtragen…</option>'+S.sessions.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>';}).join('')+'<option value="__free">Freies Training</option></select></div></div>';
  return h;
}

/* ---------- Übungen ---------- */

  var h='<h1>Übungen</h1>';
  if(ui.exDetail){
    var x=S.exercises[ui.exDetail];if(!x){ui.exDetail=null;return renderExercises();}
    h+='<button class="tiny" data-act="exback">‹ zurück</button>';

    h+='<label class="small" style="margin-top:.5rem">Ziel / Rolle</label><input data-xf="goal" value="'+esc(x.goal||'')+'" placeholder="z. B. Quad-Hauptübung, schwer">';

    h+='<div class="row" style="margin-top:.5rem"><label class="row small" style="gap:.3rem"><input type="checkbox" data-xf="uniOk"'+(x.uniOk?' checked':'')+'> einseitig möglich</label><span class="grow"></span><button class="tiny danger" data-exdel="'+x.id+'">Übung löschen</button></div></div>';
    var rows=[];S.workouts.forEach(function(w){w.entries.forEach(function(e){if(e.exId===x.id){var dn=e.sets.filter(filled);if(dn.length)rows.push({date:w.date,uni:e.uni,sets:dn,note:e.note});}});});
    rows.sort(function(a,b){return a.date<b.date?1:-1;});
    h+='<h3>Verlauf</h3>';
    if(rows.length){
      var asc=rows.slice().reverse(),base=pd(asc[0].date),pts=[],bst=null;
      asc.forEach(function(r){
        var mx=0,ms=null;r.sets.forEach(function(st){var v=e1(st);if(v>mx){mx=v;ms=st;}});
        if(mx>0){pts.push({x:(pd(r.date)-base)/864e5,y:Math.round(mx*10)/10});
          if(!bst||mx>bst.v)bst={v:mx,s:ms,date:r.date};}});

      if(pts.length>1)h+=chartHTML([{pts:pts,color:'var(--quad)',dots:1}],{x0:fmtDate(asc[0].date),x1:fmtDate(asc[asc.length-1].date)})

  h+=muscleChips(ui.exMuscle,'exm')+chips(EQUIP_FILTERS,ui.exEquip,'exe');
  h+='<div id="ex_list">'+exTabListHTML()+'</div>';

}

function bwChart(){
  var l=S.bodyweight.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  if(l.length<2)return '';
  var base=pd(l[0].date);
  var raw=l.map(function(b){return {x:(pd(b.date)-base)/864e5,y:Number(b.kg)};});
  var avg=l.map(function(b,i){
    var a=bwAvgRange(b.date,7);
    return a==null?null:{x:(pd(b.date)-base)/864e5,y:Math.round(a*10)/10};}).filter(Boolean);
  var se=[{pts:raw,color:'var(--mute)',w:1.2,dots:1}];
  if(avg.length>1)se.push({pts:avg,color:'var(--acc)',w:2.5});
  return chartHTML(se,{x0:fmtDate(l[0].date),x1:fmtDate(l[l.length-1].date),h:110})
    +'<p class="small mute" style="margin-top:0">Punkte: Einzelwerte. Linie: 7-Tage-Schnitt.</p>';}

  h+='<div class="card"><b>Backup</b><p class="small mute">Deine Daten liegen nur in diesem Browser. Einmal pro Woche exportieren.</p><div class="row"><button class="primary" data-act="export">Exportieren</button><button data-act="copyexp">In Zwischenablage</button><button data-act="csv">CSV für Excel</button></div><p class="small mute" style="margin:.5rem 0 0">'+(S.lastExport?'Letztes Backup: '+fmtDate(S.lastExport):'Noch kein Backup gemacht.')+'</p><textarea id="expbox" placeholder="Export erscheint hier" style="margin-top:.5rem;font-size:.75rem;min-height:4rem"></textarea></div>';
  h+='<div class="card"><b>Import</b><p class="small mute">Ersetzt alle aktuellen Daten.</p><input type="file" id="impfile" accept="application/json,.json"><textarea id="impbox" placeholder="…oder JSON hier einfügen" style="margin-top:.5rem;font-size:.75rem;min-height:4rem"></textarea><div class="row" style="margin-top:.5rem"><button data-act="import">Importieren</button></div></div>';
  h+='<div class="card"><b>Körpergewicht</b>'+bwChart()+(S.bodyweight.length===1?'<p class="mute small">Ein Eintrag. Ab dem zweiten erscheint hier der Verlauf.</p>':'')+(S.bodyweight.length?'<details><summary>Alle Einträge</summary><div class="tablewrap"><table class="cmp">'+S.bodyweight.slice().reverse().map(function(b){return '<tr><td>'+fmtDate(b.date)+'</td><td>'+b.kg+' kg</td></tr>';}).join('')+'</table></div></details>':'<p class="mute small">Noch keine Einträge.</p>')+'</div>';
  h+='<div class="card"><b>Übungsliste zurücksetzen</b><p class="small mute">Stellt gelöschte Standardübungen wieder her und aktualisiert Ziel und Ausführung. Eigene Übungen, eigene Notizen und Historie bleiben.</p><button class="danger" data-act="resetex">Standardübungen wiederherstellen</button></div></div>';
  return h;
}

/* ---------- Aktionen ---------- */
function startWorkout(sid,date){
  var s=sessionById(sid);var entries=[];
  if(s)entries=s.slots.map(function(sl){var arr=[];for(var i=0;i<sl.sets;i++)arr.push(emptySet());return {slotId:sl.id,exId:sl.exId,uni:!!sl.uni,sets:arr,setsTarget:sl.sets,repMin:sl.repMin,repMax:sl.repMax,note:''};});
  return {id:uid(),date:date||today(),sessionId:sid||'',sessionName:s?s.name:'Freies Training',kurz:false,note:'',entries:entries};
}
function finishSave(){
  var a=S.active;
  a.entries.forEach(function(e){if(!e.sets.some(filled)&&!e.note)e._empty=true;});
  a.entries=a.entries.filter(function(e){return !e._empty;});a.entries.forEach(function(e){delete e._empty;});
  S.workouts.push(a);
  var idx=-1;S.sessions.forEach(function(s,i){if(s.id===a.sessionId)idx=i;});
  if(idx>=0)S.nextIdx=(idx+1)%S.sessions.length;
  S.active=null;ui.finish=false;stopRest();wakeOff();save();view='cal';ui.cal.sel=a.date;ui.cal.anchor=a.date;ui.openW=a.id;render();toast('Gespeichert');
}
function doExport(){
  S.lastExport=today();save();render();
  var json=JSON.stringify(S);var box=document.getElementById('expbox');if(box)box.value=json;
  try{var blob=new Blob([json],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='training-backup-'+today()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);}catch(e){}
  toast('Export erstellt');
}
function doImport(text){
  try{var o=JSON.parse(text);if(!o.exercises||!o.sessions||!o.workouts)throw 0;if(!confirm('Alle aktuellen Daten ersetzen?'))return;S=o;migrate();save();render();toast('Importiert');}catch(e){toast('Ungültige Datei');}
}
function deleteWorkout(id){
  var idx=-1;S.workouts.forEach(function(w,i){if(w.id===id)idx=i;});if(idx<0)return;
  var w=S.workouts.splice(idx,1)[0];if(ui.editId===id)ui.editId=null;save();render();
  toastUndo('Einheit gelöscht',function(){S.workouts.splice(Math.min(idx,S.workouts.length),0,w);});}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-tab],[data-start],[data-act],[data-open],[data-openw],[data-editw],[data-exopen],[data-day],[data-jump],[data-calnav],[data-calmode],[data-pick],[data-pkclose],[data-pkm],[data-pke],[data-exm],[data-exe],[data-swap],[data-uni],[data-setplus],[data-setminus],[data-copy],[data-persist],[data-edel],[data-adel],[data-pickplan],[data-up],[data-down],[data-del],[data-panker],[data-puni],[data-addslot],[data-sup],[data-sdown],[data-sdel],[data-exdel],[data-stop],[data-rest],[data-done],[data-stp],[data-noteopen],[data-fold],[data-undo],[data-ptog],[data-sdup],[data-pss],[data-addalt],[data-rot],[data-rotdel],[data-wrot]');
  if(!el)return;var d=el.dataset,parts;
  if(d.undo){var uf=undoFn;undoFn=null;document.getElementById('toast').classList.remove('show');
    if(uf){uf();save();render();toast('Wiederhergestellt');}return;}
  /* Picker */
  if(ui.picker){
    if(document.querySelector('.overlay.closing'))return;
    if(d.pick!==undefined){applyPick(d.pick);return;}
    if(d.pkm!==undefined){ui.picker.muscle=d.pkm;refreshPicker();return;}
    if(d.pke!==undefined){ui.picker.equip=d.pke;refreshPicker();return;}
    if(d.stop)return;
    if(d.pkclose){closeOverlay(function(){ui.picker=null;render();});return;}
    return;
  }
  /* Timer und Satz-Interaktionen ohne Neuaufbau der Seite */
  if(d.rest){
    if(d.rest==='skip'){stopRest();}
    else if(d.rest==='m30'){adjRest(-30);}
    else if(d.rest==='p30'){adjRest(30);}
    else if(d.rest==='pause'){if(rest.paused){rest.end=Date.now()+rest.paused*1000;rest.paused=0;}else{rest.paused=restLeft()||1;}persistRest();drawRest();}
    return;}
  var wq=wctx();
  if(wq){
    if(d.done!==undefined){toggleDone(wq,d.done);return;}
    if(d.stp!==undefined){stepVal(wq,d.stp);return;}
    if(d.noteopen!==undefined){toggleNoteRow(d.noteopen);return;}
    if(d.fold!==undefined){var fc=document.querySelectorAll('.card.entry')[+d.fold];
      foldCard(wq,+d.fold,!(fc&&fc.classList.contains('folded')));return;}
  }
  if(d.tab){view=d.tab;ui.exDetail=null;ui.editId=null;ui.finish=false;render();window.scrollTo(0,0);return;}
  if(d.start){if(S.active){toast('Es läuft schon eine Einheit');return;}S.active=startWorkout(d.start);view='home';save();audioCtx();wakeOn();render();window.scrollTo(0,0);return;}
  if(d.act==='bw'){var v=document.getElementById('bwin').value;if(!v)return;var t=today();S.bodyweight=S.bodyweight.filter(function(x){return x.date!==t;});S.bodyweight.push({date:t,kg:Number(v)});save();render();toast('Gewicht gespeichert');return;}
  /* Workout (aktiv oder Bearbeitung) */
  var w=wctx();
  if(w){
    if(d.act==='kurz'){w.kurz=!w.kurz;save();render();return;}
    if(d.wrot!==undefined){var wp=d.wrot.split('|'),we=w.entries[+wp[0]],wx=ex(wp[1]);we.exId=wp[1];we.repMin=wx.reps[0];we.repMax=wx.reps[1];if(!wx.uniOk)we.uni=false;save();render();return;}
    if(d.swap!==undefined){openPicker({mode:'swap',ei:+d.swap,muscle:ex(w.entries[+d.swap].exId).muscle},ex(w.entries[+d.swap].exId).muscle);return;}
    if(d.uni!==undefined){var e=w.entries[+d.uni];e.uni=!e.uni;save();render();return;}
    if(d.setplus!==undefined){w.entries[+d.setplus].sets.push(emptySet());save();render();return;}
    if(d.setminus!==undefined){var ss=w.entries[+d.setminus].sets;if(ss.length>1)ss.pop();save();render();return;}
    if(d.copy!==undefined){var en=w.entries[+d.copy];var p=lastPerf(en.exId,en.uni,w.id);if(p){en.sets=p.sets.map(function(s){return {w:s.w,r:s.r,rir:'',note:''};});save();render();}return;}
    if(d.persist!==undefined){var en2=w.entries[+d.persist];var sl2=slotById(sessionById(w.sessionId),en2.slotId);if(sl2){sl2.exId=en2.exId;sl2.uni=en2.uni;sl2.muscle=ex(en2.exId).muscle;sl2.repMin=en2.repMin;sl2.repMax=en2.repMax;save();render();toast('Plan aktualisiert');}return;}
    if(d.edel!==undefined){var ri=+d.edel,re=w.entries.splice(ri,1)[0],rw=w;save();render();
      toastUndo('Übung entfernt',function(){rw.entries.splice(Math.min(ri,rw.entries.length),0,re);});return;}
    if(d.act==='addentry'){openPicker({mode:'addentry'},'');return;}
    if(d.act==='finish'){ui.finish=true;render();window.scrollTo(0,document.body.scrollHeight);return;}
    if(d.act==='finishback'){ui.finish=false;render();return;}
    if(d.act==='finishsave'){finishSave();return;}
    if(d.act==='finishdiscard'){if(confirm('Einheit verwerfen? Alle Eingaben gehen verloren.')){S.active=null;ui.finish=false;stopRest();wakeOff();save();render();}return;}
    if(d.act==='editdone'){ui.editId=null;save();render();return;}
    if(d.act==='wdel'){deleteWorkout(d.id);return;}
  }
  /* Kalender */
  if(d.calmode){ui.cal.mode=d.calmode;render();return;}
  if(d.calnav){var n=+d.calnav,a=pd(ui.cal.anchor);if(ui.cal.mode==='month')a.setMonth(a.getMonth()+n);else if(ui.cal.mode==='week')a.setDate(a.getDate()+7*n);else a.setFullYear(a.getFullYear()+n);ui.cal.anchor=ds(a);render();return;}
  if(d.jump){ui.cal.anchor=d.jump;ui.cal.sel=d.jump;ui.cal.mode='month';render();return;}
  if(d.day){ui.cal.sel=d.day;if(d.tomonth){ui.cal.mode='month';ui.cal.anchor=d.day;}render();return;}
  if(d.openw){ui.openW=ui.openW===d.openw?null:d.openw;render();return;}
  if(d.editw){ui.editId=d.editw;view='cal';render();window.scrollTo(0,0);return;}
  if(d.act==='wdel'){deleteWorkout(d.id);return;}
  if(d.act==='addact'){S.activities.push({id:uid(),date:ui.cal.sel,text:'',minutes:'',note:''});save();render();return;}
  if(d.adel){var ai=-1;S.activities.forEach(function(a,i){if(a.id===d.adel)ai=i;});if(ai<0)return;
    var ra=S.activities.splice(ai,1)[0];save();render();
    toastUndo('Aktivität gelöscht',function(){S.activities.splice(Math.min(ai,S.activities.length),0,ra);});return;}
  /* Übungen */
  if(d.exm!==undefined){ui.exMuscle=d.exm;render();return;}
  if(d.exe!==undefined){ui.exEquip=d.exe;render();return;}
  if(d.exopen){ui.exDetail=d.exopen;render();window.scrollTo(0,0);return;}
  if(d.act==='exback'){ui.exDetail=null;render();return;}
  if(d.act==='newex'){var id=newExerciseDialog(ui.exMuscle||'Quads');if(id){ui.exDetail=id;render();}return;}
  if(d.exdel){var inPlan=[];S.sessions.forEach(function(s){s.slots.forEach(function(sl){if(sl.exId===d.exdel)inPlan.push(s.name);});});
    var msg='Übung endgültig löschen?'+(inPlan.length?' Sie steht im Plan ('+inPlan.join(', ')+') und wird dort entfernt.':'')+' Historie-Einträge bleiben und zeigen "(gelöschte Übung)".';
    if(confirm(msg)){S.sessions.forEach(function(s){s.slots=s.slots.filter(function(sl){return sl.exId!==d.exdel;});});delete S.exercises[d.exdel];ui.exDetail=null;save();render();}return;}
  /* Plan */
  if(d.pickplan){parts=d.pickplan.split('.');var sl0=sessionById(parts[0]).slots[+parts[1]];openPicker({mode:'plan',sid:parts[0],idx:+parts[1],muscle:sl0.muscle},sl0.muscle);return;}
  if(d.addslot){openPicker({mode:'addslot',sid:d.addslot,muscle:''},'');return;}
  if(d.up!==undefined||d.down!==undefined){parts=(d.up||d.down).split('.');var s3=sessionById(parts[0]),i3=+parts[1],j3=d.up!==undefined?i3-1:i3+1;if(j3<0||j3>=s3.slots.length)return;var tmp=s3.slots[i3];s3.slots[i3]=s3.slots[j3];s3.slots[j3]=tmp;save();render();return;}
  if(d.del){parts=d.del.split('.');var ds=sessionById(parts[0]),di=+parts[1],dsl=ds.slots.splice(di,1)[0];save();render();
    toastUndo('Aus dem Plan entfernt',function(){ds.slots.splice(Math.min(di,ds.slots.length),0,dsl);});return;}
  if(d.panker){parts=d.panker.split('.');var sl5=sessionById(parts[0]).slots[+parts[1]];sl5.anker=!sl5.anker;save();render();return;}
  if(d.puni){parts=d.puni.split('.');var sl6=sessionById(parts[0]).slots[+parts[1]];sl6.uni=!sl6.uni;save();render();return;}
  if(d.sup!==undefined||d.sdown!==undefined){var i8=+(d.sup!==undefined?d.sup:d.sdown),j8=d.sup!==undefined?i8-1:i8+1;if(j8<0||j8>=S.sessions.length)return;var t8=S.sessions[i8];S.sessions[i8]=S.sessions[j8];S.sessions[j8]=t8;save();render();return;}
  if(d.sdel){if(S.sessions.length<=1){toast('Mindestens eine Einheit');return;}
    var si2=-1;S.sessions.forEach(function(q,i){if(q.id===d.sdel)si2=i;});if(si2<0)return;
    var rs=S.sessions.splice(si2,1)[0],oldNext=S.nextIdx;S.nextIdx=0;save();render();
    toastUndo('Plan-Einheit gelöscht',function(){S.sessions.splice(Math.min(si2,S.sessions.length),0,rs);S.nextIdx=oldNext;});return;}
  if(d.ptog){ui.planOpen[d.ptog]=!ui.planOpen[d.ptog];render();return;}
  if(d.sdup){var so=sessionById(d.sdup);if(!so)return;var cp=JSON.parse(JSON.stringify(so));cp.id=uid();cp.name=so.name+' (Kopie)';
    cp.slots.forEach(function(q){q.id=uid();});var pos=S.sessions.indexOf(so);S.sessions.splice(pos+1,0,cp);save();render();toast('Einheit dupliziert');return;}
  if(d.pss){parts=d.pss.split('.');var sl9=sessionById(parts[0]).slots[+parts[1]];sl9.ss=!sl9.ss;save();render();return;}
  if(d.addalt){parts=d.addalt.split('.');var slA=sessionById(parts[0]).slots[+parts[1]];openPicker({mode:'addalt',sid:parts[0],idx:+parts[1],muscle:slA.muscle},slA.muscle);return;}
  if(d.rot){parts=d.rot.split('.');var slR=sessionById(parts[0]).slots[+parts[1]],nid=parts.slice(2).join('.'),xr=ex(nid),oldId=slR.exId;
    slR.alt=(slR.alt||[]).map(function(q){return q===nid?oldId:q;});
    slR.exId=nid;slR.muscle=xr.muscle;slR.repMin=xr.reps[0];slR.repMax=xr.reps[1];if(!xr.uniOk)slR.uni=false;
    save();render();toast('Getauscht: '+xr.name);return;}
  if(d.rotdel){parts=d.rotdel.split('.');var slD=sessionById(parts[0]).slots[+parts[1]],did=parts.slice(2).join('.');
    slD.alt=(slD.alt||[]).filter(function(q){return q!==did;});save();render();return;}
  if(d.act==='addsession'){var nm=prompt('Name der neuen Einheit:','Einheit '+String.fromCharCode(65+S.sessions.length));if(!nm)return;S.sessions.push({id:uid(),name:nm,tag:'',slots:[]});save();render();return;}
  if(d.act==='loadtpl'){var k=document.getElementById('tplsel').value;if(!TEMPLATES[k])return;if(confirm('Aktuellen Plan durch "'+TEMPLATES[k].name+'" ersetzen?')){S.sessions=TEMPLATES[k].build();S.planName=TEMPLATES[k].name;S.nextIdx=0;save();render();toast('Plan geladen');}return;}
  /* Mehr */
  if(d.act==='theme'){setTheme(d.val);render();return;}
  if(d.act==='restset'){setRestDur(+d.val);render();toast('Pause '+fmtT(+d.val));return;}
  if(d.act==='blocknow'){S.blockStart=today();save();render();toast('Block gestartet');return;}
  if(d.act==='export'){doExport();return;}
  if(d.act==='csv'){doCSV();return;}
  if(d.act==='copyexp'){S.lastExport=today();save();render();var json=JSON.stringify(S);var box=document.getElementById('expbox');box.value=json;box.select();try{navigator.clipboard.writeText(json).then(function(){toast('Kopiert');});}catch(e){document.execCommand('copy');toast('Kopiert');}return;}
  if(d.act==='import'){var f=document.getElementById('impfile').files[0];if(f){var rd=new FileReader();rd.onload=function(){doImport(rd.result);};rd.readAsText(f);}else doImport(document.getElementById('impbox').value);return;}
  if(d.act==='resetex'){if(confirm('Standardübungen wiederherstellen und Ziel/Ausführung aktualisieren?')){Object.keys(SEED).forEach(function(k){var old=S.exercises[k];var n=JSON.parse(JSON.stringify(SEED[k]));if(old&&old.note)n.note=old.note;S.exercises[k]=n;});save();render();toast('Wiederhergestellt');}return;}
});
document.addEventListener('change',function(ev){
  var t=ev.target,d=t.dataset;
  if(t.id==='pastsel'&&t.value){var wv=startWorkout(t.value==='__free'?'':t.value,ui.cal.sel);S.workouts.push(wv);ui.editId=wv.id;view='cal';save();render();window.scrollTo(0,0);return;}
  if(t.dataset.sound){S.sound=t.checked;save();toast(t.checked?'Ton an':'Ton aus');return;}
  if(t.id==='blockstart'){if(t.value){S.blockStart=t.value;save();render();}return;}
  var w=wctx();
  if(w&&d.wdate){if(t.value){w.date=t.value;save();}return;}
  if(d.xf==='muscle'||d.xf==='equip'||d.xf==='uniOk'){var x=S.exercises[ui.exDetail];if(!x)return;x[d.xf]=d.xf==='uniOk'?t.checked:t.value;save();return;}
});
document.addEventListener('input',function(ev){
  var t=ev.target,d=t.dataset,parts;
  if(t.id==='ex_q'){ui.exQ=t.value;var xl=document.getElementById('ex_list');if(xl)xl.innerHTML=exTabListHTML();return;}
  if(t.id==='pk_q'&&ui.picker){ui.picker.q=t.value;var l=document.getElementById('pk_list');if(l)l.innerHTML=pickerListHTML();return;}
  var w=wctx();
  if(w){
    if(d.set){parts=d.set.split('.');var st=w.entries[+parts[0]].sets[+parts[1]];st[parts[2]]=t.value;
      if(parts[2]==='note'){var nb=document.querySelector('button[data-noteopen="'+parts[0]+'.'+parts[1]+'"]');if(nb)nb.classList.toggle('has',t.value!=='');}
      else _dirty[parts[0]+'.'+parts[1]]={w:w,e:w.entries[+parts[0]],st:st};
      saveLazy();return;}
    if(d.enote!==undefined){w.entries[+d.enote].note=t.value;saveLazy();return;}
    if(d.wnote){w.note=t.value;saveLazy();return;}
    if(d.wname){w.sessionName=t.value;saveLazy();return;}
  }
  if(d.atext||d.amin||d.anote){var id=d.atext||d.amin||d.anote;S.activities.forEach(function(a){if(a.id===id){if(d.atext)a.text=t.value;else if(d.amin)a.minutes=t.value;else a.note=t.value;}});saveLazy();return;}
  if(d.pf){parts=d.pf.split('.');var sl=sessionById(parts[0]).slots[+parts[1]];var n=Number(t.value);if(n>0)sl[parts[2]]=n;saveLazy();return;}
  if(d.pnote){parts=d.pnote.split('.');sessionById(parts[0]).slots[+parts[1]].note=t.value;saveLazy();return;}
  if(d.sname){sessionById(d.sname).name=t.value;saveLazy();return;}
  if(d.stag){sessionById(d.stag).tag=t.value;saveLazy();return;}
  if(d.xf){var x=S.exercises[ui.exDetail];if(!x)return;if(d.xf==='rep0'){x.reps[0]=Number(t.value)||x.reps[0];}else if(d.xf==='rep1'){x.reps[1]=Number(t.value)||x.reps[1];}else if(d.xf!=='uniOk'&&d.xf!=='muscle'&&d.xf!=='equip'){x[d.xf]=t.value;}saveLazy();return;}
});
window.addEventListener('beforeunload',save);
applyTheme();load();render();loadRest();
})();
