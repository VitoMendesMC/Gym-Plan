/* ---------- Diagramm ---------- */
function chartHTML(series,o){
  o=o||{};
  /* Achsen wachsen mit der Grundschrift (Block Z1): 11 Einheiten bei 17 px, darüber anteilig bis 1,6-fach (sonst überlappen die Datumsangaben); Rand links und unten wächst mit */
  var k=Math.min(1.6,Math.max(1,(parseFloat(getComputedStyle(document.documentElement).fontSize)||17)/17)),fz=(11*k).toFixed(1);
  var W=320,H=o.h||118,L=Math.round(34*k),R=8,T=10,B=Math.round(18*k);
  var all=[];series.forEach(function(se){all=all.concat(se.pts);});
  if(all.length<2)return '';
  var xs=[],ys=[];all.forEach(function(q){xs.push(q.x);ys.push(q.y);});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  var dy0=Math.min.apply(null,ys),dy1=Math.max.apply(null,ys);
  var y0=dy0,y1=dy1;
  if(y1<=y0){y1=y0+1;y0=y0-1;}
  var pad=(y1-y0)*0.12;y0-=pad;y1+=pad;
  var rnd=(dy1-dy0)>=10?0:1;
  function lbl(v){return String(rnd?Math.round(v*10)/10:Math.round(v)).replace('.',',');}
  function PX(x){return L+(x1===x0?(W-L-R)/2:(x-x0)/(x1-x0)*(W-L-R));}
  function PY(y){return T+(1-(y-y0)/(y1-y0))*(H-T-B);}
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  [dy0,(dy0+dy1)/2,dy1].forEach(function(yv){var yy=PY(yv);
    h+='<line class="gl" x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'"/>';
    h+='<text class="ax" font-size="'+fz+'" x="'+(L-5)+'" y="'+(yy+3*k).toFixed(1)+'" text-anchor="end">'+lbl(yv)+'</text>';});
  series.forEach(function(se){
    var d=se.pts.map(function(q,i){return (i?'L':'M')+PX(q.x).toFixed(1)+' '+PY(q.y).toFixed(1);}).join(' ');
    h+='<path d="'+d+'" fill="none" stroke="'+(se.color||'var(--quad)')+'" stroke-width="'+(se.w||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(se.dash?' stroke-dasharray="4 3"':'')+'/>';
    if(se.dots&&se.pts.length<=40)se.pts.forEach(function(q){
      h+='<circle cx="'+PX(q.x).toFixed(1)+'" cy="'+PY(q.y).toFixed(1)+'" r="2.6" fill="'+(se.color||'var(--quad)')+'"/>';});});
  if(o.x0)h+='<text class="ax" font-size="'+fz+'" x="'+L+'" y="'+(H-4)+'">'+esc(o.x0)+'</text>';
  if(o.x1)h+='<text class="ax" font-size="'+fz+'" x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">'+esc(o.x1)+'</text>';
  return h+'</svg>';}
function ringSVG(n,tot){
  var r=22,c=2*Math.PI*r,f=Math.max(0,Math.min(1,n/tot));
  var col=n>tot?'var(--danger)':'var(--quad)';

   Wegziehen lässt sie zurückfedern.

function dayInfo(d){

  var running=S.active&&S.active.date===d?S.active:null;

}
function countRange(from,to){var set={};S.workouts.forEach(function(w){if(w.date>=from&&w.date<=to)set[w.date]=1;});if(S.active&&S.active.date>=from&&S.active.date<=to)set[S.active.date]=1;return Object.keys(set).length;}

function calMonth(anchor){

/* ---------- Zyklus in der Karte „Block“ (Block ZY1, Look C) ---------- */
function cycPct(rir){return rir<=0?100:rir===1?85:rir===2?55:rir===3?30:20;}

/* Review-Fund M2 (ZY2): erste Änderung nach dem Blockende merkt den Zyklus, mit dem der Block gelaufen ist (cycKeep, vor der Änderung).

/* ---------- Aktionen ---------- */
function startWorkout(sid,date){
  var s=sessionById(sid);var entries=[];
  if(s)entries=s.slots.map(function(sl){var arr=[];for(var i=0;i<sl.sets;i++)arr.push(emptySet());var en={slotId:sl.id,exId:sl.exId,uni:!!sl.uni,sets:arr,setsTarget:sl.sets,repMin:sl.repMin,repMax:sl.repMax,note:''};if(sl.wu)en.wu=[];return en;});   /* Aufwärmen laut Plan: Zeilen füllt wuSync */
  return {id:uid(),date:date||today(),sessionId:sid||'',sessionName:s?s.name:'Freies Training',kurz:false,note:'',entries:entries};
}
/* Leere Aufwärmsätze und leere Drops entfernen, Merker „von Hand geändert“ weg. Beim Speichern und beim Kalender-„Fertig“ (Phase 9, Block 5) */
function tidyWu(w){w.entries.forEach(function(e){delete e.wuMan;if(e.wu){e.wu=e.wu.filter(filled);if(!e.wu.length)delete e.wu;}
    e.sets.forEach(function(st){if(st.drops){st.drops=st.drops.filter(filled);if(!st.drops.length)delete st.drops;}});});}
function finishSave(){
  var a=S.active;
  /* Leere Aufwärmsätze und leere Drops fallen weg (W1); eine Übung mit nur Aufwärmsätzen bleibt erhalten */
  tidyWu(a);
  a.entries.forEach(function(e){if(!e.sets.some(filled)&&!e.note&&!e.wu)e._empty=true;});
  a.entries=a.entries.filter(function(e){return !e._empty;});a.entries.forEach(function(e){delete e._empty;});
  S.workouts.push(a);
  var idx=-1;S.sessions.forEach(function(s,i){if(s.id===a.sessionId)idx=i;});
  if(idx>=0)S.nextIdx=(idx+1)%S.sessions.length;
  if(a.t0){var mn=Math.round((Date.now()-a.t0)/60000);if(mn>=1&&mn<=300)a.dur=mn;delete a.t0;}
  S.active=null;ui.finish=false;stopRest();wakeOff();save();
  _prC={};ui.sum=buildSum(a);view='home';render();toTop();
}
/* ---------- Zusammenfassung nach dem Speichern (Block O) ---------- */
/* Volumen je Übung (erledigte Sätze, kg × Wdh.); Vergleich nur über Übungen, die in beiden Einheiten vorkommen */
function volBy(w){var m={};w.entries.forEach(function(e){var k=e.exId+'|'+(e.uni?1:0),kg=function(v){return kgEff(v,e.exId,w.date);};e.sets.forEach(function(st){if(isDone(st)){m[k]=(m[k]||0)+kg(st.w)*Number(st.r||0);
  (st.drops||[]).forEach(function(d){if(isDone(d))m[k]+=kg(d.w)*Number(d.r||0);});}});});return m;}   /* Drops zählen mit (W3); unterstützt: bewegtes Gewicht */
function sumV(m){var v=0;Object.keys(m).forEach(function(k){v+=m[k];});return v;}
function buildSum(a){
  var sets=0,prs=[];
  a.entries.forEach(function(e){
    var base=bestEver(e.exId,e.uni,a.id),top=null;
    e.sets.forEach(function(st){if(!isDone(st))return;sets++;
      if(base>0&&e1(st,e.exId,a.date)>base*1.001&&(!top||e1(st,e.exId,a.date)>e1(top,e.exId,a.date)))top=st;});
    if(top)prs.push({name:ex(e.exId).name+(e.uni?' (je Seite)':''),set:setTxt(e.exId,top)});});
  var va=volBy(a),vol=sumV(va),prev=null,delta=null;
  S.workouts.forEach(function(w){if(w.id!==a.id&&w.sessionId===a.sessionId&&w.date<=a.date&&(!prev||w.date>=prev.date))prev=w;});
  if(prev){var vp=volBy(prev),x=0,y=0;Object.keys(va).forEach(function(k){if(vp[k]>0&&va[k]>0){x+=va[k];y+=vp[k];}});if(y>0)delta=Math.round((x-y)/y*100);}
  return {id:a.id,date:a.date,name:a.sessionName||'Training',dur:a.dur||0,sets:sets,vol:vol,delta:delta,prevDate:prev?prev.date:'',prs:prs};}
function kgfmt(v){return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}

    u.prs.forEach(function(p){h+='<div class="row"><span class="grow">'+esc(p.name)+'</span><span class="num">'+esc(p.set)+'</span></div>';});h+='</div>';}
  h+='<button class="sum-cal" data-sumcal="1">Im Kalender ansehen</button></div></div></div>';

/* R4: Export über das iOS-Teilen-Menü („In Dateien sichern“). Als gesichert zählt das Backup erst, wenn das Teilen geklappt hat.
   Ohne Teilen-Menü (ältere Browser) wie bisher als Download; dessen Erfolg lässt sich nicht prüfen. */
function doExport(){
  var json=JSON.stringify(S),name='training-backup-'+today()+'.json';
  var box=document.getElementById('expbox');if(box)box.value=json;
  function done(msg){S.lastExport=today();save();render();var b=document.getElementById('expbox');if(b)b.value=json;toast(msg);}
  try{var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(function(){done('Backup gesichert');},function(e){
        toast(e&&e.name==='AbortError'?'Abgebrochen – Backup noch nicht gesichert':'Teilen nicht möglich – bitte „Kopieren“ nutzen',4000);});
      return;}}catch(e){}
  try{var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},10000);}
  catch(e){toast('Export nicht möglich – bitte „Kopieren“ nutzen',4000);return;}
  done('Export erstellt');
}
/* Import (M1): Datei erst vollständig prüfen (inkl. Migration und Aufbau der Ansicht), sonst bleibt alles wie es war.
   Danach lässt sich der Import rückgängig machen, der alte Stand liegt bis zum nächsten Tipp im Speicher. */
function doImport(text){
  var o;try{o=JSON.parse(text);if(!o||!o.exercises||!o.sessions||!Array.isArray(o.workouts))throw 0;}catch(e){toast('Ungültige Datei – deine Daten sind unverändert',4000);return;}
  if(!confirm('Import ersetzt Plan, Übungen und alle Einheiten durch das Backup. Fortfahren?'))return;
  var prev=S;
  try{S=o;migrate();renderNow();}catch(e){S=prev;render();toast('Ungültige Datei – deine Daten sind unverändert',4000);return;}
  save();render();
  toastUndo('Importiert',function(){S=prev;});
}
function deleteWorkout(id){
  var idx=-1;S.workouts.forEach(function(w,i){if(w.id===id)idx=i;});if(idx<0)return;
  var w=S.workouts.splice(idx,1)[0];if(ui.editId===id)ui.editId=null;save();render();
  toastUndo('Einheit gelöscht',function(){S.workouts.splice(Math.min(idx,S.workouts.length),0,w);});}

  if(d.act==='cycadd'){if(cycAddOff())return;cycKeep();var clp=S.cycle[S.cycle.length-1];S.cycle.push({w:Math.max(1,Math.min(clp.w,CYC_MAXT-cycWeeks(S.cycle))),rir:clp.rir});cycSettle();save();_tapEl=null;render();return;}   /* _tapEl: nicht am Knopf ausrichten, sonst springt der Kopf der Karte */
  if(d.act==='export'){doExport();return;}
  if(d.act==='csv'){doCSV();return;}
  if(d.act==='copyexp'){var json=JSON.stringify(S),box=document.getElementById('expbox');box.value=json;box.select();
    function copied(){S.lastExport=today();save();render();var b=document.getElementById('expbox');if(b)b.value=json;toast('Kopiert – jetzt z. B. in Notizen einsetzen');}
    function failed(){toast('Kopieren nicht möglich – bitte „Exportieren“ nutzen',4000);}
    try{navigator.clipboard.writeText(json).then(copied,function(){try{document.execCommand('copy')?copied():failed();}catch(e){failed();}});}
    catch(e){try{document.execCommand('copy')?copied():failed();}catch(e2){failed();}}return;}
  if(d.act==='rawexp'){rawExport();return;}
  if(d.act==='rawcopy'){var rw=corruptRaw();try{navigator.clipboard.writeText(rw).then(function(){toast('Kopiert');},function(){toast('Kopieren nicht möglich – bitte „Exportieren“ nutzen',4000);});}catch(e){toast('Kopieren nicht möglich – bitte „Exportieren“ nutzen',4000);}return;}
  if(d.act==='rawdel'){rawDelete();return;}
  if(d.act==='import'){var f=document.getElementById('impfile').files[0];if(f){var rd=new FileReader();rd.onload=function(){doImport(rd.result);};rd.readAsText(f);}else doImport(document.getElementById('impbox').value);return;}
  if(d.act==='resetex'){if(confirm('Standardübungen wiederherstellen und Ziel/Ausführung aktualisieren?')){Object.keys(SEED).forEach(function(k){var old=S.exercises[k];var n=JSON.parse(JSON.stringify(SEED[k]));if(old&&old.note)n.note=old.note;S.exercises[k]=n;});save();render();toast('Wiederhergestellt');}return;}
});
document.addEventListener('change',function(ev){
  var t=ev.target,d=t.dataset;
  if(t.id==='pastsel'&&t.value){var wv=startWorkout(t.value==='__free'?'':t.value,ui.cal.sel);S.workouts.push(wv);ui.editId=wv.id;view='cal';save();render();toTop();return;}
  if(d.nxu&&ui.newEx){ui.newEx.uni=t.checked;return;}
  if(t.dataset.sound){S.sound=t.checked;save();toast(t.checked?'Ton an':'Ton aus');return;}
  if(t.id==='blockstart'){if(t.value){S.blockStart=t.value;delete S.endCycle;save();render();}return;}
  var w=wctx();
  if(w&&d.wdate){if(t.value){w.date=t.value;save();}return;}
  if(d.xf==='muscle'||d.xf==='equip'||d.xf==='uniOk'){var x=S.exercises[ui.exDetail];if(!x)return;x[d.xf]=d.xf==='uniOk'?t.checked:t.value;save();return;}
});
document.addEventListener('input',function(ev){
  var t=ev.target,d=t.dataset,parts;
  if(d.nxf&&ui.newEx){ui.newEx[d.nxf]=t.value;nxSync();return;}
  if(t.id==='ex_q'){ui.exQ=t.value;var xl=document.getElementById('ex_list');if(xl)xl.innerHTML=exTabListHTML();return;}
  if(t.id==='pk_q'&&ui.picker){ui.picker.q=t.value;var l=document.getElementById('pk_list');if(l)l.innerHTML=pickerListHTML();return;}
  var w=wctx();
  if(w){
    if(d.set){parts=d.set.split('.');var sref=setRef(w,parts[0]+'.'+parts[1]);if(!sref)return;var st=sref.st;st[parts[2]]=t.value;
      if(parts[2]==='note'){var nb=document.querySelector('button[data-setmenu="'+parts[0]+'.'+parts[1]+'"]');if(nb)nb.classList.toggle('has',t.value!=='');}
      else{_dirty[sref.k]={w:w,e:sref.e,st:st};if(sref.drop){if(parts[2]==='w')dropPh(w,sref.ei,sref.si);}else if(!sref.wu&&parts[2]==='w')wuPh(w,sref.ei);}
      saveLazy();return;}
    if(d.enote!==undefined){w.entries[+d.enote].note=t.value;saveLazy();return;}
    if(d.wnote){w.note=t.value;saveLazy();return;}
    if(d.wname){w.sessionName=t.value;saveLazy();return;}
  }
  if(d.atext||d.amin||d.anote){var id=d.atext||d.amin||d.anote;S.activities.forEach(function(a){if(a.id===id){if(d.atext)a.text=t.value;else if(d.amin)a.minutes=t.value;else a.note=t.value;}});saveLazy();return;}
  if(d.pf){parts=d.pf.split('.');var sl=sessionById(parts[0]).slots[+parts[1]];var n=Number(t.value);if(n>0)sl[parts[2]]=n;saveLazy();return;}
  if(d.pnote){parts=d.pnote.split('.');sessionById(parts[0]).slots[+parts[1]].note=t.value;saveLazy();return;}
  if(d.sname){sessionById(d.sname).name=t.value;saveLazy();return;}
  if(d.stag){sessionById(d.stag).tag=t.value;saveLazy();return;}
  if(d.xf){var x=S.exercises[ui.exDetail];if(!x)return;if(d.xf==='rep0'){x.reps[0]=Number(t.value)||x.reps[0];}else if(d.xf==='rep1'){x.reps[1]=Number(t.value)||x.reps[1];}else if(d.xf!=='uniOk'&&d.xf!=='muscle'&&d.xf!=='equip'){x[d.xf]=t.value;}
    if(d.xf==='name'){var xh=document.getElementById('ex_h1');if(xh)xh.textContent=t.value;}
    saveLazy();return;}
});
window.addEventListener('beforeunload',save);

function flushSave(){if(_lt){clearTimeout(_lt);_lt=null;}if(S)save();}
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushSave();});
