/* ---------- Warm-up-Rechner (Block W1) ---------- */
/* wu-calc:start – eigenständig: rechnet nur mit den übergebenen Werten. test.js liest diesen Abschnitt direkt. */
var LB=0.45359237;
/* Gewichtsraster je Gerät: welche Gewichte sich wirklich einstellen lassen
   Langhantel: 20-kg-Stange, 2,5-kg-Schritte · Kurzhantel: 1–10 kg in 1-kg-, danach 2-kg-Schritten
   Maschine: Matrix-Steckgewicht, 10 lb je Platte (Feinsteller 2,5/5/7,5 lb fürs Aufwärmen nicht nötig)
   Kabel: Matrix-Kabelturm, 5 lb je Platte · Körpergewicht: kein Rechner
   Übungen mit Scheiben statt Steckgewicht (o.plates, z. B. Hackenschmidt, Beinpresse): 2,5-kg-Schritte */
function wuGrid(equip){
  if(equip==='Langhantel')return {bar:20,step:2.5};
  if(equip==='Kurzhantel')return {db:1};
  if(equip==='Maschine')return {step:10*LB};
  if(equip==='Kabel')return {step:5*LB};
  if(equip==='Körpergewicht')return null;
  return {step:2.5};
}
/* auf das nächste einstellbare Gewicht, bei Gleichstand nach unten, eine Nachkommastelle */
function wuRound(v,g){
  var r;
  if(g.db){if(v<=1)r=1;else if(v<=10)r=Math.ceil(v-.5);else r=10+2*Math.ceil((v-10)/2-.5);}
  else{var n=v/g.step,f=Math.floor(n);r=(n-f>.5+1e-9?f+1:f)*g.step;}
  return Math.round(r*10)/10;
}
/* Standard-Schema nach Wdh-Untergrenze: [Prozent, Wdh]; 0 % = leere Stange */
function wuScheme(repMin,equip,work){
  var s=repMin<=6?[[50,5],[70,3],[85,1]]:repMin<=10?[[50,8],[75,3]]:[[50,10]];
  if(equip==='Langhantel'&&repMin<=6&&work>=40)s.unshift([0,10]);
  return s;
}
/* Aufwärmsätze zum Arbeitsgewicht. o.assist: unterstützte Übung (Gewicht = Hilfe), dann zählt Körpergewicht o.bw minus Hilfe.
   Stufen unter 0 % gelten als 0 %, über 100 % als 100 %. Stufen auf oder über dem Arbeitsgewicht (bzw. mit weniger Hilfe) und doppelte fallen weg. */
function wuCalc(work,repMin,equip,o){
  o=o||{};work=Number(work);var g=o.plates?{step:2.5}:wuGrid(equip),out=[];
  if(!g||!(work>0))return out;
  var sch=o.scheme||wuScheme(repMin,equip,work);
  if(o.assist){var bw=Number(o.bw),eff=bw-work;if(!(bw>0)||!(eff>0))return out;
    sch.forEach(function(s){var p=Math.max(0,Math.min(100,Number(s[0])||0));if(p<=0)return;
      var a=wuRound(bw-p/100*eff,g);
      if(a<=work||(out.length&&out[out.length-1].w<=a))return;
      out.push({w:a,r:s[1]});});
    return out;}
  sch.forEach(function(s){var p=Math.max(0,Math.min(100,Number(s[0])||0));
    var w=p>0?wuRound(work*p/100,g):(g.bar||0);
    if(g.bar&&w<g.bar)w=g.bar;
    if(!(w>0)||w>=work||(out.length&&out[out.length-1].w>=w))return;
    out.push({w:w,r:s[1]});});
  return out;
}
/* Drop-Vorschlag (W3): etwa −20 % vom vorigen Gewicht, auf das Raster des Geräts; unterstützt umgekehrt (+20 % Hilfe).
   Liegt das gerundete Gewicht nicht unter dem vorigen, eine Stufe weiter runter. Unter der Stange oder bei Körpergewicht: kein Vorschlag. */
function dropCalc(prev,equip,o){
  o=o||{};prev=Number(prev);var g=o.plates?{step:2.5}:wuGrid(equip);
  if(!g||!(prev>0))return null;
  if(o.assist){var a=wuRound(prev*1.2,g),t=prev*1.2;while(a<=prev){t+=0.5;a=wuRound(t,g);}return a;}
  var t2=prev*0.8,v=wuRound(t2,g);
  while(v>=prev&&t2>0){t2-=0.5;v=wuRound(t2,g);}
  if(!(v>0)||v>=prev||(g.bar&&v<g.bar))return null;
  return v;
}
/* wu-calc:end */

function isDone(st){return st.done==null?(st.w!==''&&st.r!==''):!!st.done;}
/* ---------- Aufwärmsätze im Training (W2) ---------- */
/* Satz-Schlüssel: "ei.si" = Arbeitssatz si, "ei.wN" = Aufwärmsatz N. Aufwärmsätze liegen in entry.wu, getrennt von den Arbeitssätzen:
   Vorwerte, Bestleistung, Fortschritt, Volumen und Zuklappen sehen sie nicht. */
function setRef(w,k){var p=String(k).split('.'),ei=+p[0],e=w&&w.entries[ei];if(!e||p[1]==null)return null;
  /* Drop (W3): "ei.dSI-J" = Drop J nach Arbeitssatz SI */
  if(p[1].charAt(0)==='d'){var q=p[1].slice(1).split('-'),ps=e.sets[+q[0]],dj=+q[1],ds=ps&&ps.drops&&ps.drops[dj];
    return ds?{e:e,ei:ei,i:dj,si:+q[0],st:ds,drop:true,k:ei+'.d'+(+q[0])+'-'+dj}:null;}
  var wu=p[1].charAt(0)==='w',i=+(wu?p[1].slice(1):p[1]),st=(wu?(e.wu||[]):e.sets)[i];
  return st?{e:e,ei:ei,i:i,st:st,wu:wu,k:ei+'.'+(wu?'w':'')+i}:null;}
/* Aufklapp-Zustand „Aufwärmen“ hängt an der Übung (slotId), nicht an der Position: nach „Übung entfernen“ rutscht er nicht weiter (Phase 9, Block 5) */
function wuKey(w,ei){var e=w.entries[ei];return w.id+'|'+(e&&e.slotId||ei);}
function wuSet(){return {w:'',r:'',note:'',done:false};}
function wuTouched(st){return filled(st)||!!st.done;}
/* Arbeitsgewicht für den Rechner: heute eingetragen, sonst Hinweis (+2,5/+5 kg), sonst letztes Mal (unterstützt: geringste Hilfe) */
function wuBase(w,ei){
  var e=w.entries[ei],x=ex(e.exId),i;
  for(i=0;i<e.sets.length;i++)if(Number(e.sets[i].w)>0)return {kg:Number(e.sets[i].w),src:'heute'};
  var perf=lastPerf(e.exId,e.uni,w.id);if(!perf)return null;
  var ws=perf.sets.map(function(q){return Number(q.w);}).filter(function(v){return v>0;});if(!ws.length)return null;
  if(x.assist)return {kg:Math.min.apply(null,ws),src:'letztes Mal'};
  var top=Math.max.apply(null,ws),h=progHint(e,perf);
  return h?{kg:top+Number(String(h.inc).replace(',','.')),src:'Hinweis'}:{kg:top,src:'letztes Mal'};}
function wuSugg(w,ei){var e=w.entries[ei],x=ex(e.exId),b=wuBase(w,ei);
  return {base:b,rows:b?wuCalc(b.kg,e.repMin,x.equip,{assist:x.assist,bw:bwAt(w.date),plates:x.plates}):[]};}
/* Solange kein Aufwärmsatz angefasst und die Zahl nicht von Hand geändert ist (wuMan), folgt die Zeilenzahl dem Rechner */
function wuSync(w,ei){var e=w.entries[ei];if(!e.wu||e.wuMan||e.wu.some(wuTouched))return;
  var n=wuSugg(w,ei).rows.length||wuScheme(e.repMin,ex(e.exId).equip,0).length;
  while(e.wu.length<n)e.wu.push(wuSet());e.wu.length=n;}
function wuVals(e,sg){var x=ex(e.exId);return (x.assist?'Hilfe ':'')+e.wu.map(function(st,i){var r=sg.rows[i];
  return filled(st)?dk(st.w)+'×'+st.r:(r?dk(r.w)+'×'+r.r:'–');}).join(' · ');}
function wuCap(sg,e){return sg.base?'· aus '+dk(Math.round(sg.base.kg*100)/100)+' kg'+(e&&ex(e.exId).assist?' Hilfe':''):'';}
/* Arbeitsgewicht geändert: Vorschläge (Platzhalter) und Zeile neu, ohne Neuaufbau (Tastatur bleibt offen) */

/* Eigener Listener statt click-Router: Auslösen auf pointerdown mit preventDefault, damit Feld und Tastatur den Fokus behalten.

var AC=null;
/* Audio (Phase 9, Block 4): iOS unterbricht den Audio-Kontext nach Sperren, Anruf oder App-Wechsel („interrupted“) oder schließt ihn.
   Deshalb aus jedem Zustand außer „running“ wecken. Geschlossen oder Wecken abgelehnt: beim nächsten Mal neu anlegen. */
function audioCtx(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  if(!AC||AC.state==='closed')AC=new C();
  if(AC.state!=='running'){var a=AC,r=a.resume();if(r&&r.catch)r.catch(function(){if(AC===a)AC=null;});}
  return AC;}catch(e){return null;}}
function beep(c){try{[0,.22,.44].forEach(function(off){var o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=880;o.connect(g);g.connect(c.destination);
    var t0=c.currentTime+off;g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(.3,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+.16);
    o.start(t0);o.stop(t0+.18);});}catch(e){}}
/* Läuft das Audio gerade nicht, erst wecken, dann piepen. Kommt das Wecken später als 3 s, entfällt der Ton (kein verspätetes Piepen). */
function alarm(){
  var c=audioCtx(),t=Date.now();
  if(c){if(c.state==='running')beep(c);
    else try{c.resume().then(function(){if(c.state==='running'&&Date.now()-t<3000)beep(c);},function(){});}catch(e){}}
  try{if(navigator.vibrate)navigator.vibrate([180,90,180]);}catch(e){}}
/* Jeder Tipp im laufenden Training (mit Ton an) und jede Rückkehr in die App weckt das Audio, damit der nächste Pausenton klingt.
   Ein Tipp ist für iOS die Erlaubnis, Audio zu starten. */
document.addEventListener('pointerdown',function(){if(S&&S.active&&S.sound!==false&&(!AC||AC.state!=='running'))audioCtx();},true);
document.addEventListener('visibilitychange',function(){if(AC&&document.visibilityState==='visible')audioCtx();});
var wl=null;
function wakeOn(){if(wl||!navigator.wakeLock||!S||!S.active)return;
  try{navigator.wakeLock.request('screen').then(function(x){wl=x;x.addEventListener('release',function(){wl=null;});},function(){});}catch(e){}}
function wakeOff(){if(wl){try{wl.release();}catch(e){}wl=null;}}
function updateWake(){if(S&&S.active)wakeOn();else wakeOff();}
document.addEventListener('visibilitychange',function(){

/* ---------- Auswertung ---------- */
/* Unterstützte Übungen (Phase 9, Block 2): eingetragen wird die Hilfe. Für Bestleistung, 1RM und Volumen zählt das bewegte Gewicht
   = Körpergewicht − Hilfe. Körpergewicht: letzter Eintrag am oder vor dem Tag der Einheit, sonst der früheste vorhandene.
   Ohne Körpergewicht zählt der Satz dort nicht (0). Andere Übungen rechnen wie bisher mit dem eingetragenen Gewicht. */
function bwAt(date){var b=null,f=null;S.bodyweight.forEach(function(x){if(!f||x.date<f.date)f=x;if(x.date<=date&&(!b||x.date>=b.date))b=x;});var o=b||f;return o?Number(o.kg)||0:0;}
function kgEff(v,exId,date){if(v===''||v==null)return 0;var n=Number(v);if(!exId||!ex(exId).assist)return n;var bw=bwAt(date);return bw>0?Math.max(0,bw-n):0;}
function e1(st,exId,date){var w=kgEff(st.w,exId,date),r=Number(st.r||0);return (w>0&&r>0)?w*(1+r/30):0;}
/* Satz als Text, unterstützt mit „Hilfe“ davor */
function setTxt(exId,st,sep){return (ex(exId).assist?'Hilfe ':'')+dk(st.w)+(sep==null?' × ':sep)+st.r;}
function nfmt(v){return String(Math.round(v*10)/10).replace('.',',');}
var _prC={};
function bestEver(exId,uni,excludeId){
  var k=exId+'|'+(uni?1:0)+'|'+(excludeId||'');
  if(_prC[k]!=null)return _prC[k];
  var b=0;
  S.workouts.forEach(function(w){if(w.id===excludeId)return;
    w.entries.forEach(function(e){if(e.exId!==exId||!!e.uni!==!!uni)return;
      e.sets.forEach(function(st){var v=e1(st,exId,w.date);if(v>b)b=v;});});});
  return (_prC[k]=b);}
function isPRset(w,e,st){var b=bestEver(e.exId,e.uni,w.id);return b>0&&isDone(st)&&e1(st,e.exId,w.date)>b*1.001;}
/* PR in beide Richtungen neu bewerten: setzen, wenn neu erreicht; entfernen, wenn durch Korrektur weg */
function refreshPR(w,ei,si){
  var e=w.entries[ei],st=e.sets[si],on=isPRset(w,e,st);
  var btn=document.querySelector('button[data-done="'+ei+'.'+si+'"]'),tr=btn&&btn.closest('tr');

    if(any&&!pill){var g=card.querySelector('.etags');if(g)g.insertAdjacentHTML('beforeend','<span class="pill pr just">PR</span>');}
    else if(!any&&pill)pill.remove();}
  if(on&&!was&&tr)prToast('Bestleistung: '+setTxt(e.exId,st));}

/* ---------- Diagramm ---------- */
function chartHTML(series,o){
  o=o||{};
  /* Achsen wachsen mit der Grundschrift (Block Z1): 11 Einheiten bei 17 px, darüber anteilig bis 1,6-fach (sonst überlappen die Datumsangaben); Rand links und unten wächst mit */
  var k=Math.min(1.6,Math.max(1,(parseFloat(getComputedStyle(document.documentElement).fontSize)||17)/17)),fz=(11*k).toFixed(1);
  var W=320,H=o.h||118,L=Math.round(34*k),R=8,T=10,B=Math.round(18*k);
  var all=[];series.forEach(function(se){all=all.concat(se.pts);});
  if(all.length<2)return '';
  var xs=[],ys=[];all.forEach(function(q){xs.push(q.x);ys.push(q.y);});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  var dy0=Math.min.apply(null,ys),dy1=Math.max.apply(null,ys);
  var y0=dy0,y1=dy1;
  if(y1<=y0){y1=y0+1;y0=y0-1;}
  var pad=(y1-y0)*0.12;y0-=pad;y1+=pad;
  var rnd=(dy1-dy0)>=10?0:1;
  function lbl(v){return String(rnd?Math.round(v*10)/10:Math.round(v)).replace('.',',');}
  function PX(x){return L+(x1===x0?(W-L-R)/2:(x-x0)/(x1-x0)*(W-L-R));}
  function PY(y){return T+(1-(y-y0)/(y1-y0))*(H-T-B);}
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  [dy0,(dy0+dy1)/2,dy1].forEach(function(yv){var yy=PY(yv);
    h+='<line class="gl" x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'"/>';
    h+='<text class="ax" font-size="'+fz+'" x="'+(L-5)+'" y="'+(yy+3*k).toFixed(1)+'" text-anchor="end">'+lbl(yv)+'</text>';});
  series.forEach(function(se){
    var d=se.pts.map(function(q,i){return (i?'L':'M')+PX(q.x).toFixed(1)+' '+PY(q.y).toFixed(1);}).join(' ');
    h+='<path d="'+d+'" fill="none" stroke="'+(se.color||'var(--quad)')+'" stroke-width="'+(se.w||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(se.dash?' stroke-dasharray="4 3"':'')+'/>';
    if(se.dots&&se.pts.length<=40)se.pts.forEach(function(q){
      h+='<circle cx="'+PX(q.x).toFixed(1)+'" cy="'+PY(q.y).toFixed(1)+'" r="2.6" fill="'+(se.color||'var(--quad)')+'"/>';});});
  if(o.x0)h+='<text class="ax" font-size="'+fz+'" x="'+L+'" y="'+(H-4)+'">'+esc(o.x0)+'</text>';
  if(o.x1)h+='<text class="ax" font-size="'+fz+'" x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">'+esc(o.x1)+'</text>';
  return h+'</svg>';}
function ringSVG(n,tot){
  var r=22,c=2*Math.PI*r,f=Math.max(0,Math.min(1,n/tot));
  var col=n>tot?'var(--danger)':'var(--quad)';
  return '<svg class="ring" viewBox="0 0 56 56"><circle cx="28" cy="28" r="'+r+'" fill="none" stroke="var(--soft)" stroke-width="6"/>'
    +'<circle cx="28" cy="28" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-f)).toFixed(1)+'" transform="rotate(-90 28 28)"/>'

/* ---------- Drag & Drop (Pointer Events) ---------- */
var drag=null;
var GRIP='<svg viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="7.5" cy="2.5" r="1.6"/><circle cx="2.5" cy="8" r="1.6"/><circle cx="7.5" cy="8" r="1.6"/><circle cx="2.5" cy="13.5" r="1.6"/><circle cx="7.5" cy="13.5" r="1.6"/></svg>';
function dragItems(cont){return Array.prototype.slice.call(cont.children).filter(function(c){return c.hasAttribute('data-dragitem');});}
document.addEventListener('pointerdown',function(ev){
  var h=ev.target.closest('[data-drag]');if(!h)return;
  var item=h.closest('[data-dragitem]');if(!item)return;
  drag={item:item,cont:item.parentNode,kind:h.dataset.drag,pid:ev.pointerId,moved:false};
  try{h.setPointerCapture(ev.pointerId);}catch(e){}
  item.classList.add('dragging');document.body.classList.add('dragging');ev.preventDefault();});
document.addEventListener('pointermove',function(ev){
  if(!drag||ev.pointerId!==drag.pid)return;
  drag.moved=true;var y=ev.clientY,items=dragItems(drag.cont);
  if(y<90)window.scrollBy(0,-10);else if(y>window.innerHeight-130)window.scrollBy(0,10);
  for(var i=0;i<items.length;i++){var el=items[i];if(el===drag.item)continue;var r=el.getBoundingClientRect();
    if(y<r.top+r.height/2){if(el.previousElementSibling!==drag.item)drag.cont.insertBefore(drag.item,el);return;}}
  var last=items[items.length-1];if(last!==drag.item)drag.cont.insertBefore(drag.item,last.nextSibling);});
function dragEnd(cancel){
  if(!drag)return;var d=drag;drag=null;document.body.classList.remove('dragging');
  if(cancel||!d.moved){d.item.classList.remove('dragging');if(cancel&&d.moved)render();return;}
  var items=dragItems(d.cont);
  if(d.kind==='sess'){
    var curId=(S.sessions[S.nextIdx%S.sessions.length]||{}).id;
    var ns=items.map(function(c){return sessionById(c.dataset.sid);}).filter(Boolean);
    if(ns.length===S.sessions.length){S.sessions=ns;var ni=0;S.sessions.forEach(function(q,i){if(q.id===curId)ni=i;});S.nextIdx=ni;}
  }else{
    var sess=sessionById(d.kind.slice(5));
    if(sess){var nsl=items.map(function(c){return slotById(sess,c.dataset.slid);}).filter(Boolean);
      if(nsl.length===sess.slots.length)sess.slots=nsl;}
  }
  save();render();toast('Reihenfolge gespeichert');}
document.addEventListener('pointerup',function(){dragEnd(false);});

/* ---------- CSV ---------- */
function csvCell(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function doCSV(){
  /* Spalte „Satzart“ (W1): Aufwärmen (Satz A1, A2 …), Arbeitssatz (1, 2 …), Drop (3.1, 3.2 … direkt nach seinem Satz) */
  var rows=[['Datum','Einheit','Übung','Muskelgruppe','Gerät','Satz','Satzart','kg','Wdh','RIR','je Seite','Satz-Notiz','Übungs-Notiz','Einheits-Notiz']];
  S.workouts.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(w){
    w.entries.forEach(function(e){var x=ex(e.exId);
      function add(nr,art,st){rows.push([w.date,w.sessionName,x.name,x.muscle,x.equip,nr,art,dk(st.w),st.r,st.rir||'',e.uni?'ja':'',st.note||'',e.note,w.note]);}
      (e.wu||[]).forEach(function(st,i){if(filled(st))add('A'+(i+1),'Aufwärmen',st);});
      e.sets.forEach(function(st,i){if(filled(st))add(i+1,'Arbeitssatz',st);
        (st.drops||[]).forEach(function(d,j){if(filled(d))add((i+1)+'.'+(j+1),'Drop',d);});});});});
  if(S.bodyweight.length){rows.push([]);rows.push(['Datum','Körpergewicht kg']);
    S.bodyweight.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(b){rows.push([b.date,dk(b.kg)]);});}
  var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');
  try{var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='training-'+today()+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('CSV erstellt');}
  catch(e){toast('CSV-Export nicht möglich');}}

/* ---------- Elastische Pille (Block M1b, Prinzip „Elastic toggles“ von kabarza) ---------- */
/* Tab-Leiste und Plan-Segment „beidseitig / je Seite“. Die Pille besteht aus zwei Kopien ihres Endstücks (.cap) und einem schlichten
   Steg (.bar) dazwischen: die Kopien gleiten, nur der Steg wird skaliert. So bleiben die runden Enden bei jeder Länge rund
   (scaleX auf das Ganze würde sie zum Ei verzerren).
   Ein Flug ist eine einzige Bewegung: gedämpfte Feder, die Pille ist so lang, wie sie schnell ist, solange sie lang ist flacher (squash),
   vor der Ankunft wieder rund. Pro Teil genau ein animate() mit dem ganzen Flug als Keyframes, nur transform: läuft weiter,
   auch wenn die Seite gerade neu aufgebaut wird.
   Drücken: die Pille neigt sich in 150 ms zum gedrückten Knopf und wartet; Loslassen startet den Flug aus dieser Pose,
   Wegziehen lässt sie zurückfedern.
   Der Zustand hängt am Schlüssel (data-seg bzw. id), nicht am Element: nach einem Neuaufbau geht es dort weiter, wo die Pille gerade war.
   „Bewegung reduzieren“: kein Flug, keine Neigung, die Pille steht sofort am Ziel. */
var ELP={stretch:.5,squash:.19,bounce:.61,duration:1100,press:.47};   /* Werte vom Nutzer (15.10.2026) */
var EL_LEAN_MS=150,EL_LEAN_MAX=.45,EL_STRETCH=.5,EL_OV=6;
/* EL_LEAN_MAX: Neigung als Anteil der Pillenbreite · EL_STRETCH: Dehnung bei stretch 1 als Anteil der Breite
   EL_OV: Überschwingen höchstens etwa 6 px, egal wie weit der Flug */
var PILL='<i class="ind" aria-hidden="true"><i class="cap"></i><i class="cap"></i><i class="bar"></i></i>';

/* Gedämpfte Feder, normiert auf t = 0..1 der Dauer. bounce 0 = kritisch gedämpft, kein Überschwingen. */
function springX(t,bounce){return springZ(t,Math.max(.08,1-.9*bounce));}
/* dieselbe Feder mit Dämpfung z (z ≥ 1: ohne Überschwingen); W: Eigenfrequenz, sonst so, dass sie am Ende ausgeschwungen ist */
function springZ(t,z,W){
  if(z>=.999){W=W||7.4;return 1-(1+W*t)*Math.exp(-W*t);}
  W=W||5.3/z;var wd=W*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*W*t)*(Math.cos(wd*t)+(z*W/wd)*Math.sin(wd*t));}
/* Zustand zur Box holen und Maße auffrischen. fresh = die Pille ist ein neues Element (Neuaufbau), dim = Größe hat sich geändert. */
function elBind(box){
  var ind=box.querySelector(':scope>.ind'),bs=box.querySelectorAll(':scope>button');if(!ind||!bs.length)return null;
  var k=box.dataset.seg||box.id,st=_elS[k];
  /* unsichtbar (z. B. zugeklappte Plan-Einheit): nichts messen; beim nächsten Sichtbarwerden sofort setzen statt fliegen */
  if(!bs[0].offsetHeight){if(st)st.L=null;return null;}
  if(!st)st=_elS[k]={L:null,R:null,lean:0,dir:1,run:null,anims:[]};
  st.fresh=st.ind!==ind;
  if(st.fresh){st.ind=ind;st.a=ind.children[0];st.b=ind.children[1];st.bar=ind.children[2];}   /* alte Animationen bleiben in st.anims: ihre Zeit zählt weiter */
  var H=bs[0].offsetHeight,mw=1e9,last=bs[bs.length-1],C;
  Array.prototype.forEach.call(bs,function(b){if(b.offsetWidth<mw)mw=b.offsetWidth;});
  C=Math.max(1,Math.min(H,mw));                                       /* Endstück: so breit wie hoch, höchstens wie der schmalste Knopf */
  st.dim=!st.fresh&&(C!==st.C||H!==st.H);st.C=C;st.H=H;
  st.min=bs[0].offsetLeft-1;st.max=last.offsetLeft+last.offsetWidth+1;   /* weiche Wand: nicht weiter als 1 px über die Knöpfe hinaus */
  ind.style.top=bs[0].offsetTop+'px';ind.style.height=H+'px';ind.style.width=C+'px';
  return st;}
/* Wand: Pille bleibt innerhalb, wird dort notfalls kürzer (drückt sich an), nie kürzer als ihr Endstück */
function elClamp(st,f){var L=Math.max(f.L,st.min),R=Math.min(f.R,st.max);
  if(R-L<st.C){if(L===st.min)R=L+st.C;else L=R-st.C;}
  return {L:L,R:R,sy:f.sy==null?1:f.sy};}

  'translateX('+(f.L+st.C/2).toFixed(2)+'px) scaleX('+Math.max(0,f.R-f.L-st.C).toFixed(2)+')','scaleY('+(f.sy==null?1:f.sy).toFixed(4)+')'];}
/* Ein animate() pro Teil, alle Bilder als Keyframes (gleichmäßig verteilt, linear dazwischen). ofs: dort weiter (nach Neuaufbau) */
function elPlay(st,fr,D,ofs){

/* In Ruhe ohne Animation (billig: viele Segmente im Plan) */

  var t=elTf(st,f);st.a.style.transform=t[0];st.b.style.transform=t[1];st.bar.style.transform=t[2];st.ind.style.transform='';}
/* Ruhelage am Ziel, mit Neigung */
function elRest(st){return {L:st.L-(st.dir<0?st.lean:0),R:st.R+(st.dir>0?st.lean:0),sy:1};}
/* Zeit im laufenden Lauf: aus der echten Animation (startet erst mit dem nächsten Bild), sonst aus der Uhr */

function elNow(st){var r=st.run;if(!r)return elRest(st);var k=elT(st)/r.D;if(k>=1)return elRest(st);
  var f=Math.max(0,k)*(r.fr.length-1),i=Math.floor(f),j=Math.min(i+1,r.fr.length-1),a=r.fr[i],b=r.fr[j],u=f-i;
  return {L:a.L+(b.L-a.L)*u,R:a.R+(b.R-a.R)*u,sy:a.sy+(b.sy-a.sy)*u};}

function elEase(st,from,D,fn){var to=elRest(st),N=Math.max(8,Math.round(D/16)),fr=[];

/* Drücken: zum Knopf neigen (dir 1 = nach rechts). Gesperrt in der ersten Hälfte eines Flugs. Startlage vor dem Ändern merken. */
function elLean(st,dir){
  if(elReduce()||!(ELP.press>0)||st.L==null)return;
  if(st.run&&st.run.fl&&elT(st)<st.run.D*.5)return;

/* Weggezogen: zurück in die Ruhe federn */
function elRelax(st){if(!st.lean)return;var from=elNow(st);st.lean=0;
  if(elReduce()){elSet(st);return;}

/* Der Flug: Gleiten + Dehnen + Feder + Squash in einer Bewegung, aus der jetzigen Lage (auch aus der Neigung) */
function elFlight(st,L1,R1){
  var P=ELP,from=elNow(st);st.lean=0;st.L=L1;st.R=R1;
  if(elReduce()){elSet(st);return;}
  var D=Math.max(1,P.duration),N=Math.max(16,Math.round(D/12)),xs=[],i;
  var m0=(from.L+from.R)/2,W0=from.R-from.L,m1=(L1+R1)/2,W1=R1-L1,dist=Math.abs(m1-m0),dir=m1>=m0?1:-1;
  /* Überschwingen höchstens etwa EL_OV px, egal wie weit der Flug: bei weiten Flügen dämpft die Feder stärker.
     So bremst die Pille ohne Ruck (kein Kappen der Bahn); kurze Flüge schwingen so weit, wie bounce es sagt. */
  var z=Math.max(.08,1-.9*P.bounce),Wn=z<.999?5.3/z:7.4;   /* Eigenfrequenz bleibt: gleiches Antrittstempo */
  if(z<.999){var f0=Math.exp(-z*Math.PI/Math.sqrt(1-z*z)),f=Math.min(f0,EL_OV/Math.max(1,dist));
    if(f<f0){var lf=Math.log(f);z=-lf/Math.sqrt(Math.PI*Math.PI+lf*lf);}}

  var vs=xs.map(function(_,i){return xs[Math.min(N,i+1)]-xs[Math.max(0,i-1)];}),vPeak=0,iPeak=0;
  vs.forEach(function(v,i){if(Math.abs(v)>vPeak){vPeak=Math.abs(v);iPeak=i;}});

/* Pille an den aktiven Knopf bringen. anim: gleiten (sonst sofort setzen, z. B. nach Drehen) */

  st.ind.style.visibility='';

  if(st.L==null||!anim){st.L=L;st.R=R;st.lean=0;elSet(st);return;}

  if(st.fresh||st.dim){var r=st.run,el=elT(st);   /* neu aufgebaut oder neue Größe, gleiches Ziel: weiter, wo die Pille gerade war */

/* Druck-Feedback: beim Herunterdrücken neigen, beim Wegziehen zurückfedern. Der Flug selbst startet über den normalen Klick.

document.addEventListener('pointerdown',function(ev){

/* ---------- Gleitende Markierung der Chips (Block M1) ---------- */
/* Filter-Chips (Kalender, Übungen, Übung wählen, Pausentimer): die Auswahl gleitet zur neuen Stelle und dehnt sich unterwegs
   (Kante in Bewegungsrichtung sofort, die andere --d-lag später; Variante C der Bewegungsprobe).
   Die Auswahl ist eine Kopie der Reihe in Auswahlfarbe (.segov) über den Knöpfen, per clip-path auf die Pille zugeschnitten.
   Nach einem Neuaufbau startet die Bewegung dort, wo die alte Auswahl gerade war (segSnap vor, segPlace nach dem Neuaufbau).
   „Bewegung reduzieren“: die globale Regel lässt keine Lage-Übergänge zu, sie springt.
   Tab-Leiste und Plan-Segment haben seit Block M1b eine elastische Pille (elPlace); segGo reicht sie dorthin weiter. */
var SEG_X=8;   /* Kopie ragt je Seite 8 px über die Reihe (Überschwingen der Feder) */
function segOv(box){
  var o=box.querySelector(':scope>.segov');
  if(!o){o=document.createElement('div');o.className='segov';o.setAttribute('aria-hidden','true');box.appendChild(o);}
  o.style.width='0';var h='';
  Array.prototype.forEach.call(box.querySelectorAll(':scope>button'),function(b){
    h+='<span style="left:'+(b.offsetLeft+SEG_X)+'px;top:'+b.offsetTop+'px;width:'+b.offsetWidth+'px;height:'+b.offsetHeight+'px">'+esc(b.textContent)+'</span>';});
  o.style.width=(box.scrollWidth+2*SEG_X)+'px';o.style.height=box.clientHeight+'px';o.innerHTML=h;return o;}
/* aktuelle Lage der Auswahl-Kopie (auch mitten in der Bewegung), in Kopie-Koordinaten */
function segCur(el){var cs=getComputedStyle(el);return {l:parseFloat(cs.getPropertyValue('--segl')),r:parseFloat(cs.getPropertyValue('--segr'))};}
function segEdge(el,L,R,anim){
  var cur=el.style.getPropertyValue('--segl')?segCur(el).l:NaN;
  if(!anim||isNaN(cur))el.style.transition='none';
  else{var d=' var(--d-pill) var(--sp-pill)',rt=L>cur;el.style.transition='--segl'+d+(rt?' var(--d-lag)':' 0s')+',--segr'+d+(rt?' 0s':' var(--d-lag)');}
  el.style.setProperty('--segl',L+'px');el.style.setProperty('--segr',R+'px');}
/* from: alte Lage {l, re} in Box-Koordinaten (linke und rechte Kante) */
function segGo(box,anim,from){
  if(!box)return;
  if(!box.classList.contains('chips')){elPlace(box,anim);return;}   /* Tab-Leiste, Plan-Segment: elastische Pille (M1b) */
  var el=segOv(box),b=box.querySelector(':scope>button.on');
  if(!b){el.style.opacity='0';el.style.removeProperty('--segl');return;}   /* keine Auswahl (z. B. freie Pausendauer) */
  var hid=el.style.opacity==='0';el.style.opacity='';
  var x=SEG_X,W=parseFloat(el.style.width),L=b.offsetLeft+x,R=W-L-b.offsetWidth;
  el.style.setProperty('--segt',b.offsetTop+'px');el.style.setProperty('--segb',(parseFloat(el.style.height)-b.offsetTop-b.offsetHeight)+'px');
  /* alte Lage festschreiben, dann gleiten (nur wenn sie sich wirklich unterscheidet: spart Layout) */
  if(from&&anim&&!hid&&(Math.abs(from.l+x-L)>.5||Math.abs(from.re+x-(L+b.offsetWidth))>.5)){segEdge(el,from.l+x,W-from.re-x,false);void el.offsetWidth;}
  segEdge(el,L,R,anim&&!hid);}
/* vor dem Neuaufbau: Lage jeder Chip-Auswahl und Bildlauf der Reihe merken. Die elastische Pille merkt sich ihre Lage selbst (_elS). */
function segSnap(root){var m={};
  Array.prototype.forEach.call(root.querySelectorAll('[data-seg]'),function(box){
    var el=box.querySelector(':scope>.segov'),k={sx:box.scrollLeft};m[box.dataset.seg]=k;
    if(!el||el.style.opacity==='0')return;
    var c=segCur(el);if(isNaN(c.l)||isNaN(c.r))return;
    k.l=c.l-SEG_X;k.re=el.offsetWidth-c.r-SEG_X;});
  return m;}
/* nach dem Neuaufbau: Bildlauf zurück (sonst springt die Reihe an den Anfang), Auswahl von der alten Lage gleiten lassen */
function segPlace(root,snap){Array.prototype.forEach.call(root.querySelectorAll('[data-seg]'),function(box){var k=snap&&snap[box.dataset.seg];
  if(k&&k.sx)box.scrollLeft=k.sx;segGo(box,true,k&&k.l!=null?k:null);});}
/* Tab-Leiste bleibt bestehen (kein Neuaufbau), damit die Pille gleiten kann; nur aktiver Tab und Icons wechseln */
var TABS=[['home','Heute'],['plan','Plan'],['cal','Kalender'],['ex','Übungen'],['more','Mehr']];
function syncTabs(){var nav=document.getElementById('tabs');
  if(!nav.querySelector(':scope>.ind'))nav.innerHTML=PILL+TABS.map(function(x){return '<button data-tab="'+x[0]+'">'+ico(x[0])+'<span>'+x[1]+'</span></button>';}).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('button[data-tab]'),function(b){var on=b.dataset.tab===view;if(b.classList.contains('on')===on)return;
    b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');b.firstElementChild.outerHTML=ico(b.dataset.tab,'',on);});
  segGo(nav,true);}
function segAll(){segGo(document.getElementById('tabs'),false);Array.prototype.forEach.call(document.querySelectorAll('[data-seg]'),function(b){segGo(b,false);});}
window.addEventListener('resize',segAll);window.addEventListener('pageshow',segAll);
/* iOS meldet beim Drehen „resize“, bevor die neue Breite feststeht (Pille war danach weg): auf die tatsächliche Größe der Leiste hören */
/* nur Breite: Höhenänderungen (Neuaufbau, Zuklappen) dürfen ein laufendes Gleiten nicht abbrechen */

function dayInfo(d){
  var ws=S.workouts.filter(function(w){return w.date===d;});var acts=S.activities.filter(function(a){return a.date===d;});
  var running=S.active&&S.active.date===d?S.active:null;
  return {ws:ws,acts:acts,running:running,gym:ws.length>0||!!running,any:ws.length>0||acts.length>0||!!running};
}
function countRange(from,to){var set={};S.workouts.forEach(function(w){if(w.date>=from&&w.date<=to)set[w.date]=1;});if(S.active&&S.active.date>=from&&S.active.date<=to)set[S.active.date]=1;return Object.keys(set).length;}
function renderCal(){
  var c=ui.cal;var t=today();

  var ws=weekStart(t),y=t.slice(0,4),m=t.slice(0,7);

  h+='<div class="stats s4 kc-stats"><span>Woche <b>'+countRange(ws,addDays(ws,6))+'</b></span><span>Monat <b>'+countRange(m+'-01',m+'-31')+'</b></span><span>Jahr <b>'+countRange(y+'-01-01',y+'-12-31')+'</b></span><span>Serie <b>'+streakWeeks()+'</b></span></div>';

function dayClass(d,extra){var i=dayInfo(d);return (extra||'')+(i.gym?' gym':'')+(d===ui.cal.sel?' sel':'')+(d===today()?' today':'');}
function dots(d){var i=dayInfo(d);var s='';if(i.running)s+='<i class="r"></i>';i.ws.forEach(function(){s+='<i class="g"></i>';});i.acts.forEach(function(){s+='<i class="a"></i>';});return '<div class="dots">'+s+'</div>';}
function calMonth(anchor){
  var d=pd(anchor);var y=d.getFullYear(),mo=d.getMonth();var first=new Date(y,mo,1);var off=(first.getDay()+6)%7;var dim=new Date(y,mo+1,0).getDate();

  var start=new Date(y,mo,1-off);
  for(var i=0;i<42;i++){var dd=new Date(start);dd.setDate(start.getDate()+i);var s=ds(dd);var other=dd.getMonth()!==mo;if(i>=35&&other)break;

/* Zeitstrahl bewegen: vorher Lage und Farbe jedes Kästchens merken (Schlüssel = Phase + Woche darin), nach dem Neuaufbau mit Feder
   von dort an den neuen Platz; neue wachsen aus Breite 0, entfernte schrumpfen weg, Farbe und Schraffur blenden über. */
var CYP={lean:3,leanMs:260,rollDist:100,rollMs:460,rollB:.39,tlMs:560,tlB:.42,rubPx:7,rubMs:460};   /* Werte des Nutzers aus der Bewegungsprobe ZY0 */
function cyGeo(el){var cs=getComputedStyle(el);return {l:parseFloat(cs.left)||0,w:parseFloat(cs.width)||0};}
function cycTLSnap(){var tl=document.getElementById('cyctl');if(!tl)return null;var b={},r=tl.querySelector('.cycring');
  Array.prototype.forEach.call(tl.querySelectorAll('i[data-k]'),function(el){var g=cyGeo(el);g.c=getComputedStyle(el).backgroundColor;g.dl=el.classList.contains('dl');b[el.dataset.k]=g;});
  var rg=cyGeo(r);rg.vis=getComputedStyle(r).opacity!=='0';return {b:b,r:rg};}
function cyN(ms){return Math.max(8,Math.round(ms/14));}
function cySlide(el,from,to,fade){var ms=CYP.tlMs,N=cyN(ms),k=[];
  for(var i=0;i<=N;i++){var e=i===N?1:springX(i/N,CYP.tlB),f={left:(from.l+(to.l-from.l)*e).toFixed(2)+'px',width:Math.max(0,from.w+(to.w-from.w)*e).toFixed(2)+'px'};if(fade)f.opacity=Math.min(1,i/N*3);k.push(f);}
  el.animate(k,{duration:ms,easing:'linear'});}
function cycTLAnim(s){var tl=document.getElementById('cyctl');if(!tl||!s||elReduce())return;
  var seen={},prev=null;
  Array.prototype.forEach.call(tl.querySelectorAll('i[data-k]'),function(el){var k=el.dataset.k,o=s.b[k],g=cyGeo(el),po=prev&&s.b[prev.dataset.k];seen[k]=1;
    var from=o||{l:po?po.l+po.w+3:(prev?cyGeo(prev).l:0),w:0};
    if(Math.abs(from.l-g.l)>.3||Math.abs(from.w-g.w)>.3)cySlide(el,from,g,!o);
    if(o){var c=getComputedStyle(el).backgroundColor;if(o.c!==c)el.animate([{backgroundColor:o.c},{backgroundColor:c}],{duration:300,easing:'ease'});
      if(o.dl!==el.classList.contains('dl'))try{el.animate([{opacity:o.dl?1:0},{opacity:o.dl?0:1}],{duration:300,easing:'ease',pseudoElement:'::after'});}catch(x){}}
    prev=el;});
  var ring=tl.querySelector('.cycring');
  Object.keys(s.b).forEach(function(k){if(seen[k])return;var o=s.b[k],g=document.createElement('i');if(o.dl)g.className='dl';
    g.style.cssText='background:'+o.c+';left:'+o.l+'px;width:'+o.w+'px';tl.insertBefore(g,ring);
    g.animate([{width:o.w+'px',opacity:1},{width:'0px',opacity:0}],{duration:Math.round(CYP.tlMs*.5),easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'}).onfinish=function(){g.remove();};});
  var rv=getComputedStyle(ring).opacity!=='0',rg=cyGeo(ring);
  if(rv&&s.r.vis){if(Math.abs(rg.l-s.r.l)>.3||Math.abs(rg.w-s.r.w)>.3)cySlide(ring,s.r,rg,false);}
  else if(rv)ring.animate([{opacity:0},{opacity:1}],{duration:200,easing:'ease'});}
function cycTLUpdate(){var tl=document.getElementById('cyctl');if(!tl)return;var s=cycTLSnap();tl.innerHTML=cycTL();cycTLAnim(s);}
/* Stepper: Drücken neigt die Zahl zur Taste, Loslassen rollt die alte weg und lässt die neue hereinfedern, an der Grenze Gummi */
function cyTx(el){var m=new DOMMatrix(getComputedStyle(el).transform);return {x:m.m41,y:m.m42};}
function cyMove(el,from,to,ms,fn,keep){var N=cyN(ms),k=[];for(var i=0;i<=N;i++){var v=from+(to-from)*(i===N?1:fn(i/N));k.push({transform:'translateX('+v.toFixed(2)+'px)'});}
  var old=el._mv,a=el.animate(k,{duration:ms,easing:'linear',fill:keep?'forwards':'none'});el._mv=a;if(old)old.cancel();

function startWorkout(sid,date){
  var s=sessionById(sid);var entries=[];
  if(s)entries=s.slots.map(function(sl){var arr=[];for(var i=0;i<sl.sets;i++)arr.push(emptySet());var en={slotId:sl.id,exId:sl.exId,uni:!!sl.uni,sets:arr,setsTarget:sl.sets,repMin:sl.repMin,repMax:sl.repMax,note:''};if(sl.wu)en.wu=[];return en;});   /* Aufwärmen laut Plan: Zeilen füllt wuSync */
  return {id:uid(),date:date||today(),sessionId:sid||'',sessionName:s?s.name:'Freies Training',kurz:false,note:'',entries:entries};
}
/* Leere Aufwärmsätze und leere Drops entfernen, Merker „von Hand geändert“ weg. Beim Speichern und beim Kalender-„Fertig“ (Phase 9, Block 5) */
function tidyWu(w){w.entries.forEach(function(e){delete e.wuMan;if(e.wu){e.wu=e.wu.filter(filled);if(!e.wu.length)delete e.wu;}
    e.sets.forEach(function(st){if(st.drops){st.drops=st.drops.filter(filled);if(!st.drops.length)delete st.drops;}});});}
function finishSave(){
  var a=S.active;
  /* Leere Aufwärmsätze und leere Drops fallen weg (W1); eine Übung mit nur Aufwärmsätzen bleibt erhalten */
  tidyWu(a);
  a.entries.forEach(function(e){if(!e.sets.some(filled)&&!e.note&&!e.wu)e._empty=true;});
  a.entries=a.entries.filter(function(e){return !e._empty;});a.entries.forEach(function(e){delete e._empty;});
  S.workouts.push(a);
  var idx=-1;S.sessions.forEach(function(s,i){if(s.id===a.sessionId)idx=i;});
  if(idx>=0)S.nextIdx=(idx+1)%S.sessions.length;
  if(a.t0){var mn=Math.round((Date.now()-a.t0)/60000);if(mn>=1&&mn<=300)a.dur=mn;delete a.t0;}
  S.active=null;ui.finish=false;stopRest();wakeOff();save();
  _prC={};ui.sum=buildSum(a);view='home';render();toTop();
}

  (st.drops||[]).forEach(function(d){if(isDone(d))m[k]+=kg(d.w)*Number(d.r||0);});}});});return m;}   /* Drops zählen mit (W3); unterstützt: bewegtes Gewicht */
function sumV(m){var v=0;Object.keys(m).forEach(function(k){v+=m[k];});return v;}
function buildSum(a){
  var sets=0,prs=[];
  a.entries.forEach(function(e){
    var base=bestEver(e.exId,e.uni,a.id),top=null;
    e.sets.forEach(function(st){if(!isDone(st))return;sets++;
      if(base>0&&e1(st,e.exId,a.date)>base*1.001&&(!top||e1(st,e.exId,a.date)>e1(top,e.exId,a.date)))top=st;});
    if(top)prs.push({name:ex(e.exId).name+(e.uni?' (je Seite)':''),set:setTxt(e.exId,top)});});
  var va=volBy(a),vol=sumV(va),prev=null,delta=null;
  S.workouts.forEach(function(w){if(w.id!==a.id&&w.sessionId===a.sessionId&&w.date<=a.date&&(!prev||w.date>=prev.date))prev=w;});
  if(prev){var vp=volBy(prev),x=0,y=0;Object.keys(va).forEach(function(k){if(vp[k]>0&&va[k]>0){x+=va[k];y+=vp[k];}});if(y>0)delta=Math.round((x-y)/y*100);}

/* R4: Export über das iOS-Teilen-Menü („In Dateien sichern“). Als gesichert zählt das Backup erst, wenn das Teilen geklappt hat.
   Ohne Teilen-Menü (ältere Browser) wie bisher als Download; dessen Erfolg lässt sich nicht prüfen. */
function doExport(){

function doImport(text){

  if(!confirm('Import ersetzt Plan, Übungen und alle Einheiten durch das Backup. Fortfahren?'))return;
  var prev=S;
  try{S=o;migrate();renderNow();}catch(e){S=prev;render();toast('Ungültige Datei – deine Daten sind unverändert',4000);return;}
  save();render();
  toastUndo('Importiert',function(){S=prev;});
}
